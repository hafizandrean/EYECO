<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Indikasi - Simbahrang</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>
  <div class="container">
    
    <!-- Header Section -->
    <header class="glass-card header-card" style="padding: 18px 24px;">
      <div class="header-left">
        <h2 style="font-size: 1.5rem; font-weight: 800;">Detail Indikasi</h2>
        <p style="font-size: 0.85rem; color: var(--text-secondary);">Pemantauan Aktivitas Mencurigakan Sungai</p>
      </div>
      <div>
        <a href="/dashboard" class="btn btn-glass">
          <i data-feather="arrow-left"></i> Kembali
        </a>
      </div>
    </header>

    <!-- Main Detail Grid -->
    <div class="detail-grid">
      
      <!-- Left side: Image and Metadata -->
      <section class="glass-card">
        <div class="image-canvas-container" id="image-wrapper">
          <img id="detail-image" src="" alt="CCTV Capture">
          <!-- Bounding boxes will be inserted here dynamically -->
        </div>

        <div class="detail-info-list">
          <div class="detail-info-item">
            <span class="detail-info-label">Status AI</span>
            <span class="detail-info-val" id="info-ai-status">-</span>
          </div>
          <div class="detail-info-item">
            <span class="detail-info-label">Keyakinan Sistem</span>
            <span class="detail-info-val" id="info-ai-conf">-</span>
          </div>
          <div class="detail-info-item">
            <span class="detail-info-label">Waktu Kejadian</span>
            <span class="detail-info-val" id="info-time">-</span>
          </div>
          <div class="detail-info-item">
            <span class="detail-info-label">Lokasi Kejadian</span>
            <span class="detail-info-val" id="info-location">-</span>
          </div>
          <div class="detail-info-item">
            <span class="detail-info-label">Identitas / Orang</span>
            <span class="detail-info-val" id="info-identity">-</span>
          </div>
          <div class="detail-info-item">
            <span class="detail-info-label">Jenis Indikasi</span>
            <span class="detail-info-val" id="info-source-type">-</span>
          </div>
        </div>

        <div class="form-group" style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 15px;">
          <span class="detail-info-label">Keterangan Tambahan</span>
          <p id="info-description" style="font-size: 0.95rem; font-weight: 500; color: var(--text-secondary); margin-top: 6px; line-height: 1.5;">
            -
          </p>
        </div>
      </section>

      <!-- Right side: Verification form -->
      <aside class="glass-card admin-action-card">
        <div class="card-title" style="margin-bottom: 8px;">
          <i data-feather="check-square" style="color: var(--primary);"></i> Verifikasi Admin
        </div>
        
        <div class="form-group">
          <label class="form-label">Status Saat Ini</label>
          <div style="margin-top: 4px;">
            <span class="status-badge" id="info-current-admin-status">-</span>
          </div>
        </div>

        <form id="verify-form">
          <div class="form-group">
            <label class="form-label" for="verify-status">Tetapkan Validasi</label>
            <select class="form-control" id="verify-status" required>
              <option value="MENUNGGU">Belum diverifikasi (Menunggu)</option>
              <option value="VALID">Valid (Tindakan Terkonfirmasi)</option>
              <option value="DIABAIKAN">Abaikan (Bukan Bahaya/False Alarm)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="verify-notes">Tindak Lanjut & Catatan</label>
            <textarea class="form-control" id="verify-notes" placeholder="Misal: Sudah diteruskan ke ketua RT atau petugas dinas..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 12px;">
            <i data-feather="save"></i> Simpan Keputusan
          </button>
        </form>

        <button class="btn btn-glass" id="btn-telegram" style="width: 100%; color: var(--primary); border-color: rgba(59, 130, 246, 0.4);">
          <i data-feather="send"></i> Kirim ke Telegram
        </button>
      </aside>

    </div>
  </div>

  <script>
    // Extract ID from pathname: /dashboard/detections/:id
    const pathParts = window.location.pathname.split('/');
    const reportId = parseInt(pathParts[pathParts.length - 1]);

    // DOM Elements
    const imgElement = document.getElementById('detail-image');
    const imageWrapper = document.getElementById('image-wrapper');
    
    const infoAiStatus = document.getElementById('info-ai-status');
    const infoAiConf = document.getElementById('info-ai-conf');
    const infoTime = document.getElementById('info-time');
    const infoLocation = document.getElementById('info-location');
    const infoIdentity = document.getElementById('info-identity');
    const infoSourceType = document.getElementById('info-source-type');
    const infoDescription = document.getElementById('info-description');
    const infoCurrentAdminStatus = document.getElementById('info-current-admin-status');

    const verifyForm = document.getElementById('verify-form');
    const verifyStatusSelect = document.getElementById('verify-status');
    const verifyNotesTextarea = document.getElementById('verify-notes');
    const btnTelegram = document.getElementById('btn-telegram');

    // Helper to format date
    function formatDate(isoString) {
      const date = new Date(isoString);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const day = date.getDate();
      const month = months[date.getMonth()];
      const year = date.getFullYear();
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${day} ${month} ${year}, ${hours}:${minutes} WIB`;
    }

    // Load Report Data
    async function loadReportDetail() {
      if (isNaN(reportId)) {
        alert('ID Laporan tidak valid.');
        window.location.href = '/dashboard';
        return;
      }

      try {
        const res = await fetch(`/api/detections/${reportId}`);
        if (!res.ok) {
          throw new Error('Laporan tidak ditemukan');
        }
        const report = await res.json();

        // Populate fields
        imgElement.src = report.image;
        imgElement.onload = () => {
          renderBoundingBoxes(report.boundingBoxes);
        };

        infoLocation.innerText = report.location;
        infoTime.innerText = formatDate(report.timestamp);
        infoIdentity.innerText = report.identity || 'Belum diketahui';
        infoSourceType.innerText = report.sourceType || 'Rekaman';
        infoDescription.innerText = report.additionalNotes || 'Tidak ada catatan.';

        // AI Status Badge & Text
        infoAiStatus.innerHTML = report.aiStatus;
        if (report.aiStatus === 'TINGGI') infoAiStatus.className = 'badge badge-high';
        else if (report.aiStatus === 'SEDANG') infoAiStatus.className = 'badge badge-medium';
        else if (report.aiStatus === 'RENDAH') infoAiStatus.className = 'badge badge-low';
        else infoAiStatus.className = 'badge badge-none';

        infoAiConf.innerText = report.aiConfidence ? `${report.aiConfidence}%` : 'N/A';

        // Admin verification details
        updateAdminStatusPill(report.adminStatus);
        verifyStatusSelect.value = report.adminStatus;
        verifyNotesTextarea.value = report.adminNotes || '';

      } catch (err) {
        console.error('Error fetching details:', err);
        alert('Gagal memuat detail laporan.');
        window.location.href = '/dashboard';
      }
    }

    function updateAdminStatusPill(status) {
      infoCurrentAdminStatus.innerText = status;
      if (status === 'VALID') {
        infoCurrentAdminStatus.className = 'status-badge status-valid';
      } else if (status === 'DIABAIKAN') {
        infoCurrentAdminStatus.className = 'status-badge status-ignored';
      } else {
        infoCurrentAdminStatus.className = 'status-badge status-pending';
      }
    }

    // Render Bounding Boxes
    function renderBoundingBoxes(boxes) {
      // Clear previous boxes (keep only the image)
      const existingBoxes = imageWrapper.querySelectorAll('.yolo-box');
      existingBoxes.forEach(box => box.remove());

      if (!boxes || boxes.length === 0) return;

      boxes.forEach(box => {
        const boxDiv = document.createElement('div');
        
        // Match label with CSS classes
        let boxClass = 'yolo-default';
        if (box.label === 'person') boxClass = 'yolo-person';
        else if (box.label === 'cell phone') boxClass = 'yolo-cell-phone';
        else if (box.label === 'boat') boxClass = 'yolo-boat';
        else if (box.label === 'trash' || box.label === 'backpack/bag') boxClass = 'yolo-trash';

        boxDiv.className = `yolo-box ${boxClass}`;
        boxDiv.style.left = `${box.x}%`;
        boxDiv.style.top = `${box.y}%`;
        boxDiv.style.width = `${box.w}%`;
        boxDiv.style.height = `${box.h}%`;

        const labelSpan = document.createElement('span');
        labelSpan.className = 'yolo-box-label';
        labelSpan.innerText = `${box.label} ${(box.confidence).toFixed(2)}`;
        
        boxDiv.appendChild(labelSpan);
        imageWrapper.appendChild(boxDiv);
      });
    }

    // Save Decision Submission
    verifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newStatus = verifyStatusSelect.value;
      const notes = verifyNotesTextarea.value;

      try {
        const res = await fetch(`/api/detections/${reportId}/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            status: newStatus,
            notes: notes
          })
        });

        if (res.ok) {
          updateAdminStatusPill(newStatus);
          alert('Keputusan admin berhasil disimpan!');
        } else {
          alert('Gagal menyimpan keputusan admin.');
        }
      } catch (err) {
        console.error('Error saving verification:', err);
        alert('Terjadi kesalahan koneksi.');
      }
    });

    // Mock Send to Telegram
    btnTelegram.addEventListener('click', async () => {
      btnTelegram.disabled = true;
      btnTelegram.innerHTML = '<i class="spinner" style="width:14px; height:14px; border-width:2px; display:inline-block; margin-right:6px;"></i> Mengirim...';
      
      try {
        // Mock delay
        await new Promise(resolve => setTimeout(resolve, 1500));
        alert('Laporan berhasil diteruskan ke channel Telegram tim respon cepat!');
      } catch (err) {
        alert('Gagal mengirim ke Telegram.');
      } finally {
        btnTelegram.disabled = false;
        btnTelegram.innerHTML = '<i data-feather="send"></i> Kirim ke Telegram';
        feather.replace();
      }
    });

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      loadReportDetail();
      feather.replace();
    });
  </script>
</body>
</html>
