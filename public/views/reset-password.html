<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EYECO — Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: #F0F4FF; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
    .reset-card {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.04);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .reset-logo { text-align: center; margin-bottom: 32px; }
    .reset-logo img { height: 32px; width: auto; }
    .reset-logo span { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.3rem; color: #2563EB; margin-left: 8px; vertical-align: middle; }
    h1 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 800; color: #0F172A; margin: 0 0 8px; text-align: center; }
    p { font-size: 0.88rem; color: #64748B; text-align: center; margin: 0 0 28px; line-height: 1.5; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 700; color: #1E293B; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 1.5px solid rgba(0,0,0,0.06); background: #F8FAFC;
      font-family: 'Inter', sans-serif; font-size: 0.9rem;
      box-sizing: border-box; transition: all 0.2s;
    }
    .form-group input:focus { outline: none; border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .btn-primary {
      width: 100%; padding: 14px; border-radius: 12px;
      background: linear-gradient(135deg, #2563EB, #4F46E5);
      color: #fff; font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 700;
      border: none; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(37,99,235,0.25); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .toast { display: none; padding: 12px 16px; border-radius: 12px; font-size: 0.82rem; font-weight: 600; margin-bottom: 20px; }
    .toast.success { display: block; background: rgba(16,185,129,0.1); color: #059669; border: 1px solid rgba(16,185,129,0.15); }
    .toast.error { display: block; background: rgba(239,68,68,0.1); color: #DC2626; border: 1px solid rgba(239,68,68,0.15); }
    body.dark-mode { background: #0F172A; }
    body.dark-mode .reset-card { background: rgba(30,41,59,0.95); border-color: rgba(148,163,184,0.1); }
    body.dark-mode h1 { color: #F1F5F9; }
    body.dark-mode p { color: #94A3B8; }
    body.dark-mode .form-group label { color: #E2E8F0; }
    body.dark-mode .form-group input { background: #1E293B; border-color: rgba(148,163,184,0.15); color: #E2E8F0; }
    .pwd-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94A3B8; padding: 4px; }
    .input-wrap { position: relative; }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="reset-logo">
      <img src="/uploads/logo-eyeco.png" alt="EYECO">
      <span>EYECO</span>
    </div>
    <h1>Reset Password</h1>
    <p>Masukkan password baru Anda.</p>
    
    <div id="toast-message" class="toast"></div>

    <form id="reset-form">
      <div class="form-group">
        <label for="new-password">Password Baru</label>
        <div class="input-wrap">
          <input type="password" id="new-password" placeholder="Min. 6 karakter" required minlength="6" autocomplete="new-password">
          <button type="button" class="pwd-toggle" id="toggle-pwd1" aria-label="Tampilkan password"><i data-lucide="eye" style="width:16px;height:16px;"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label for="confirm-password">Konfirmasi Password</label>
        <div class="input-wrap">
          <input type="password" id="confirm-password" placeholder="Ulangi password baru" required minlength="6" autocomplete="new-password">
          <button type="button" class="pwd-toggle" id="toggle-pwd2" aria-label="Tampilkan password"><i data-lucide="eye" style="width:16px;height:16px;"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="btn-submit">
        <i data-lucide="key" style="width:16px;height:16px;vertical-align:middle;margin-right:6px;"></i>
        Reset Password
      </button>
    </form>
  </div>

  <script>
    lucide.createIcons();

    // Dark mode sync
    (function() {
      const theme = localStorage.getItem('eyeco-theme');
      if (theme === 'dark') document.documentElement.classList.add('dark-mode');
    })();

    // Get token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (!token) {
      document.getElementById('toast-message').className = 'toast error';
      document.getElementById('toast-message').textContent = 'Token reset tidak valid. Minta reset ulang.';
      document.getElementById('reset-form').style.display = 'none';
    }

    // Toggle password visibility
    function togglePwd(btnId, inputId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      if (!btn || !input) return;
      btn.addEventListener('click', () => {
        const type = input.type === 'password' ? 'text' : 'password';
        input.type = type;
        btn.innerHTML = type === 'password'
          ? '<i data-lucide="eye" style="width:16px;height:16px;"></i>'
          : '<i data-lucide="eye-off" style="width:16px;height:16px;"></i>';
        if (window.lucide) lucide.createIcons();
      });
    }
    togglePwd('toggle-pwd1', 'new-password');
    togglePwd('toggle-pwd2', 'confirm-password');

    const form = document.getElementById('reset-form');
    const btn = document.getElementById('btn-submit');
    const toast = document.getElementById('toast-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword !== confirmPassword) {
        toast.className = 'toast error';
        toast.textContent = 'Password tidak cocok.';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader" style="width:16px;height:16px;vertical-align:middle;margin-right:6px;" class="spin"></i> Memproses...';
      if (window.lucide) window.lucide.createIcons();

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword }),
        });
        const data = await res.json();

        if (data.success) {
          toast.className = 'toast success';
          toast.textContent = 'Password berhasil direset! Redirect ke login...';
          setTimeout(() => { window.location.href = '/login'; }, 2000);
        } else {
          toast.className = 'toast error';
          toast.textContent = data.error || 'Gagal mereset password.';
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="key" style="width:16px;height:16px;vertical-align:middle;margin-right:6px;"></i> Reset Password';
          if (window.lucide) window.lucide.createIcons();
        }
      } catch (err) {
        toast.className = 'toast error';
        toast.textContent = 'Terjadi kesalahan jaringan.';
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="key" style="width:16px;height:16px;vertical-align:middle;margin-right:6px;"></i> Reset Password';
        if (window.lucide) window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
