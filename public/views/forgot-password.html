<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EYECO — Lupa Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body { background: #F0F4FF; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; position: relative; }
    
    .bg-blobs {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
    }
    .blob {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.18; transition: background 0.3s;
    }
    .blob-1 { width: 560px; height: 560px; background: #2563EB; top: -120px; left: -120px; }
    .blob-2 { width: 420px; height: 420px; background: #7C3AED; bottom: -80px; right: -80px; }
    
    .wizard-card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.04);
      padding: 48px 40px 36px;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(0,0,0,0.04);
      transition: all 0.3s ease;
    }
    .wizard-logo { text-align: center; margin-bottom: 28px; }
    .wizard-logo img { height: 30px; width: auto; vertical-align: middle; }
    .wizard-logo span { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.2rem; color: #2563EB; margin-left: 6px; vertical-align: middle; }

    /* Progress indicator */
    .progress-wrap { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 32px; }
    .progress-step { display: flex; align-items: center; gap: 8px; }
    .progress-circle {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.75rem;
      transition: all 0.3s ease; flex-shrink: 0;
      background: rgba(0,0,0,0.04); color: #94A3B8; border: 2px solid #E2E8F0;
    }
    .progress-circle.active { background: #2563EB; color: #fff; border-color: #2563EB; box-shadow: 0 0 0 4px rgba(37,99,235,0.15); }
    .progress-circle.done { background: #10B981; color: #fff; border-color: #10B981; }
    .progress-line {
      width: 48px; height: 2px; background: #E2E8F0; margin: 0 4px; transition: background 0.3s; flex-shrink: 0;
    }
    .progress-line.done { background: #10B981; }
    .progress-label {
      display: none;
    }

    h1 { font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 800; color: #0F172A; margin: 0 0 6px; }
    .step-subtitle { font-size: 0.82rem; color: #64748B; margin: 0 0 24px; line-height: 1.5; }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: #1E293B; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
    .form-group input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 1.5px solid rgba(0,0,0,0.06); background: #F8FAFC;
      font-family: 'Inter', sans-serif; font-size: 0.9rem; color: #0F172A;
      outline: none; transition: all 0.2s;
    }
    .form-group input:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); background: #fff; }
    .form-group input.error { border-color: #EF4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.1); }
    .form-group .hint { font-size: 0.72rem; color: #94A3B8; margin-top: 4px; }

    .btn-primary {
      width: 100%; padding: 14px; border-radius: 12px;
      background: linear-gradient(135deg, #2563EB, #4F46E5);
      color: #fff; font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 700;
      border: none; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(37,99,235,0.25); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-ghost {
      width: 100%; padding: 12px; border-radius: 12px;
      background: transparent; color: #64748B; font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600;
      border: 1.5px solid rgba(0,0,0,0.06); cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-ghost:hover { border-color: #2563EB; color: #2563EB; background: rgba(37,99,235,0.04); }
    .btn-row { display: flex; gap: 10px; margin-top: 24px; }
    .btn-row .btn-primary { flex: 1; }
    .btn-row .btn-ghost { flex: 0 0 auto; padding: 12px 20px; }

    .toast { display: none; padding: 12px 16px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; margin-bottom: 20px; }
    .toast.error { display: block; background: rgba(239,68,68,0.1); color: #DC2626; border: 1px solid rgba(239,68,68,0.15); }
    .toast.success { display: block; background: rgba(16,185,129,0.1); color: #059669; border: 1px solid rgba(16,185,129,0.15); }

    .phone-hint { font-size: 0.78rem; color: #2563EB; font-weight: 600; margin-top: -8px; margin-bottom: 16px; padding: 8px 12px; background: rgba(37,99,235,0.06); border-radius: 8px; }

    .step { display: none; animation: fadeUp 0.3s ease; }
    .step.active { display: block; }

    .success-check {
      text-align: center; padding: 20px 0;
    }
    .success-check i { width: 48px; height: 48px; color: #10B981; margin-bottom: 12px; }

    .pwd-wrap { position: relative; }
    .pwd-wrap input { padding-right: 44px; }
    .pwd-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #94A3B8; padding: 4px;
    }

    body.dark-mode { background: #0F172A; }
    body.dark-mode .wizard-card { background: rgba(30,41,59,0.95); border-color: rgba(148,163,184,0.1); }
    body.dark-mode h1 { color: #F1F5F9; }
    body.dark-mode .step-subtitle { color: #94A3B8; }
    body.dark-mode .form-group label { color: #E2E8F0; }
    body.dark-mode .form-group input { background: #1E293B; border-color: rgba(148,163,184,0.15); color: #E2E8F0; }
    body.dark-mode .form-group input:focus { background: #1E293B; border-color: #2563EB; }
    body.dark-mode .progress-circle { border-color: rgba(148,163,184,0.2); color: #64748B; }
    body.dark-mode .progress-line { background: rgba(148,163,184,0.2); }
    body.dark-mode .btn-ghost { border-color: rgba(148,163,184,0.15); color: #94A3B8; }
    body.dark-mode .phone-hint { background: rgba(37,99,235,0.1); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>
  <div class="wizard-card">
    <div class="wizard-logo">
      <img src="/uploads/logo-eyeco.png" alt="EYECO">
      <span>EYECO</span>
    </div>

    <!-- Progress Steps -->
    <div class="progress-wrap">
      <div class="progress-step">
        <div class="progress-circle" id="p-step1">1</div>
      </div>
      <div class="progress-line" id="p-line1"></div>
      <div class="progress-step">
        <div class="progress-circle" id="p-step2">2</div>
      </div>
      <div class="progress-line" id="p-line2"></div>
      <div class="progress-step">
        <div class="progress-circle" id="p-step3">3</div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- STEP 1: Masukkan username/email -->
    <div class="step active" id="step-1">
      <h1>Cari Akun</h1>
      <p class="step-subtitle">Masukkan username atau email yang terdaftar.</p>
      <div class="form-group">
        <label for="identifier">Username atau Email</label>
        <input type="text" id="identifier" placeholder="cth: johndoe@email.com" autocomplete="username">
      </div>
      <button class="btn-primary" id="btn-step1">
        <i data-lucide="search" style="width:16px;height:16px;"></i>
        Cari Akun
      </button>
    </div>

    <!-- STEP 2: Verifikasi nomor telepon -->
    <div class="step" id="step-2">
      <h1>Verifikasi Telepon</h1>
      <p class="step-subtitle" id="step2-subtitle">Masukkan nomor telepon untuk verifikasi.</p>
      <div class="phone-hint" id="phone-hint">
        <i data-lucide="phone" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i>
        Nomor terdaftar: <strong id="masked-phone">***</strong>
      </div>
      <div class="form-group">
        <label for="phone-input">Nomor Telepon</label>
        <input type="tel" id="phone-input" placeholder="08xxxxxxxxxx" autocomplete="tel">
      </div>
      <button class="btn-primary" id="btn-step2">
        <i data-lucide="shield-check" style="width:16px;height:16px;"></i>
        Verifikasi
      </button>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn-ghost" id="btn-back1">
          <i data-lucide="arrow-left" style="width:14px;height:14px;"></i>
          Kembali
        </button>
      </div>
    </div>

    <!-- STEP 3: Password Baru -->
    <div class="step" id="step-3">
      <h1>Password Baru</h1>
      <p class="step-subtitle">Buat password baru untuk akun Anda.</p>
      <div class="form-group">
        <label for="new-password">Password Baru</label>
        <div class="pwd-wrap">
          <input type="password" id="new-password" placeholder="Min. 6 karakter" minlength="6" autocomplete="new-password">
          <button type="button" class="pwd-toggle" id="tog-pwd1" aria-label="toggle"><i data-lucide="eye" style="width:16px;height:16px;"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label for="confirm-password">Konfirmasi Password</label>
        <div class="pwd-wrap">
          <input type="password" id="confirm-password" placeholder="Ulangi password" minlength="6" autocomplete="new-password">
          <button type="button" class="pwd-toggle" id="tog-pwd2" aria-label="toggle"><i data-lucide="eye" style="width:16px;height:16px;"></i></button>
        </div>
      </div>
      <button class="btn-primary" id="btn-step3">
        <i data-lucide="key" style="width:16px;height:16px;"></i>
        Reset Password
      </button>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn-ghost" id="btn-back2">
          <i data-lucide="arrow-left" style="width:14px;height:14px;"></i>
          Kembali
        </button>
      </div>
    </div>

    <div style="text-align:center; margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.04);">
      <a href="/login" style="font-size:0.78rem; font-weight:600; color:#64748B; text-decoration:none; display:inline-flex; align-items:center; gap:4px;">
        <i data-lucide="arrow-left" style="width:12px;height:12px;"></i>
        Kembali ke Login
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    (function() {
      const theme = localStorage.getItem('eyeco-theme');
      if (theme === 'dark') document.documentElement.classList.add('dark-mode');
    })();

    let userIdentifier = '';
    let resetToken = '';

    function showStep(n) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById('step-' + n).classList.add('active');
      for (let i = 1; i <= 3; i++) {
        const c = document.getElementById('p-step' + i);
        const l = document.getElementById('p-line' + i);
        c.classList.remove('active', 'done');
        if (i < n) { c.classList.add('done'); c.innerHTML = '<i data-lucide="check" style="width:14px;height:14px;"></i>'; }
        else if (i === n) c.classList.add('active');
        if (l) l.classList.toggle('done', i < n);
      }
      if (window.lucide) window.lucide.createIcons();
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.className = 'toast ' + type;
      t.textContent = msg;
    }

    document.getElementById('btn-step1').addEventListener('click', async () => {
      const identifier = document.getElementById('identifier').value.trim();
      if (!identifier) { showToast('Masukkan username atau email', 'error'); return; }

      const btn = document.getElementById('btn-step1');
      btn.disabled = true; btn.innerHTML = '<i data-lucide="loader" class="spin" style="width:16px;height:16px;"></i> Mencari...';
      if (window.lucide) window.lucide.createIcons();

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier }),
        });
        const data = await res.json();

        if (data.success) {
          userIdentifier = identifier;
          document.getElementById('masked-phone').textContent = data.maskedPhone;
          document.getElementById('step2-subtitle').textContent = 'Halo ' + data.name + '! Verifikasi nomor telepon Anda.';
          if (!data.hasPhone) {
            document.getElementById('phone-hint').innerHTML = '<i data-lucide="alert-circle" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i> Tidak ada nomor telepon terdaftar. Hubungi admin.';
          }
          document.getElementById('toast').className = 'toast';
          showStep(2);
        } else {
          showToast(data.error || 'Akun tidak ditemukan', 'error');
        }
      } catch (err) {
        showToast('Kesalahan jaringan', 'error');
      } finally {
        btn.disabled = false; btn.innerHTML = '<i data-lucide="search" style="width:16px;height:16px;"></i> Cari Akun';
        if (window.lucide) window.lucide.createIcons();
      }
    });

    document.getElementById('btn-step2').addEventListener('click', async () => {
      const phone = document.getElementById('phone-input').value.trim();
      if (!phone) { showToast('Masukkan nomor telepon', 'error'); return; }

      const btn = document.getElementById('btn-step2');
      btn.disabled = true; btn.innerHTML = '<i data-lucide="loader" class="spin" style="width:16px;height:16px;"></i> Memverifikasi...';
      if (window.lucide) window.lucide.createIcons();

      try {
        const res = await fetch('/api/auth/verify-phone', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: userIdentifier, phone }),
        });
        const data = await res.json();

        if (data.success) {
          resetToken = data.token;
          document.getElementById('toast').className = 'toast';
          showStep(3);
        } else {
          showToast(data.error || 'Nomor telepon tidak cocok', 'error');
        }
      } catch (err) {
        showToast('Kesalahan jaringan', 'error');
      } finally {
        btn.disabled = false; btn.innerHTML = '<i data-lucide="shield-check" style="width:16px;height:16px;"></i> Verifikasi';
        if (window.lucide) window.lucide.createIcons();
      }
    });

    // Enter key on phone input
    document.getElementById('phone-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-step2').click();
    });

    document.getElementById('btn-step3').addEventListener('click', async () => {
      const pwd = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (!pwd || pwd.length < 6) { showToast('Password minimal 6 karakter', 'error'); return; }
      if (pwd !== confirm) { showToast('Password tidak cocok', 'error'); return; }

      const btn = document.getElementById('btn-step3');
      btn.disabled = true; btn.innerHTML = '<i data-lucide="loader" class="spin" style="width:16px;height:16px;"></i> Menyimpan...';
      if (window.lucide) window.lucide.createIcons();

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: resetToken, newPassword: pwd }),
        });
        const data = await res.json();

        if (data.success) {
          showToast('Password berhasil direset! Redirect ke login...', 'success');
          setTimeout(() => { window.location.href = '/login'; }, 1800);
          btn.innerHTML = '<i data-lucide="check" style="width:16px;height:16px;"></i> Berhasil!';
        } else {
          showToast(data.error || 'Gagal', 'error');
          btn.disabled = false; btn.innerHTML = '<i data-lucide="key" style="width:16px;height:16px;"></i> Reset Password';
        }
      } catch (err) {
        showToast('Kesalahan jaringan', 'error');
        btn.disabled = false; btn.innerHTML = '<i data-lucide="key" style="width:16px;height:16px;"></i> Reset Password';
      }
      if (window.lucide) window.lucide.createIcons();
    });

    // Enter key on password
    document.getElementById('confirm-password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-step3').click();
    });

    // Back buttons
    document.getElementById('btn-back1').addEventListener('click', () => showStep(1));
    document.getElementById('btn-back2').addEventListener('click', () => showStep(2));

    // Toggle password
    function togglePwd(btnId, inputId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      if (!btn || !input) return;
      btn.addEventListener('click', () => {
        const type = input.type === 'password' ? 'text' : 'password';
        input.type = type;
        btn.innerHTML = type === 'password'
          ? '<i data-lucide="eye" style="width:16px;height:16px;"></i>'
          : '<i data-lucide="eye-off" style="width:16px;height:16px;"></i>';
        if (window.lucide) lucide.createIcons();
      });
    }
    togglePwd('tog-pwd1', 'new-password');
    togglePwd('tog-pwd2', 'confirm-password');
  </script>
</body>
</html>
