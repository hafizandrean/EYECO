<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EYECO - Super Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom style tweaks specifically for Super Admin dashboard */
    body {
      background: radial-gradient(circle at top right, rgba(47, 107, 255, 0.15) 0%, rgba(9, 13, 22, 0) 60%), var(--bg-gradient);
    }
    
    .superadmin-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
      animation: pageFadeIn 0.4s ease-out;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stat-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(47, 107, 255, 0.15);
      color: var(--primary);
    }

    .admin-table-wrapper {
      margin-top: 24px;
      overflow-x: auto;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .admin-table th, .admin-table td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .admin-table th {
      font-weight: 700;
      color: var(--text-secondary);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .admin-table td {
      font-size: 0.95rem;
      color: var(--text-primary);
    }

    .admin-table tr:hover td {
      background: rgba(47, 107, 255, 0.03);
    }

    .action-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-active {
      background: var(--success-bg);
      color: var(--success);
    }

    .table-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--motion-hover);
    }

    .btn-action:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .btn-action.btn-danger-hover:hover {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    /* Modal Styling */
    .admin-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      animation: modalFadeIn 0.3s ease;
    }

    .modal-content {
      width: 100%;
      max-width: 480px;
      border-radius: var(--radius-modal);
      padding: 32px;
      position: relative;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.5rem;
    }

    .password-input-wrapper {
      position: relative;
    }

    .password-toggle-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 4px;
      transition: color var(--motion-hover);
    }

    .password-toggle-btn:hover {
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <!-- Floating Header -->
  <div class="layout-container" style="padding-bottom: 0;">
    <header class="glass-card header-floating" style="margin-top: 10px;">
      <div class="header-left-group">
        <a href="/superadmin/dashboard" class="brand-logo">
          <i data-lucide="waves" class="brand-icon"></i>
          <span>EYECO SuperAdmin</span>
        </a>
      </div>
      <div class="header-right-group">
        <button class="btn btn-glass btn-rounded" id="btn-logout" style="color: var(--danger);">
          <i data-lucide="log-out"></i> Keluar
        </button>
      </div>
    </header>
  </div>

  <div class="superadmin-container">
    
    <!-- Welcome Header -->
    <div class="dashboard-header">
      <div>
        <h1 style="font-family: 'Outfit', sans-serif; font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px;">Panel Kontrol Administrator</h1>
        <p style="color: var(--text-secondary); margin-top: 4px;">Kelola akun admin yang memiliki akses penuh ke dashboard pemantauan</p>
      </div>
      <button class="btn btn-primary btn-rounded" id="btn-tambah-admin">
        <i data-lucide="plus-circle" style="margin-right: 6px;"></i> Tambah Admin
      </button>
    </div>

    <!-- Stats Grid -->
    <div class="admin-stats">
      <div class="glass-card stat-card">
        <div class="stat-icon">
          <i data-lucide="shield-check" style="width: 28px; height: 28px;"></i>
        </div>
        <div>
          <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">Total Administrator</span>
          <h2 id="stat-total-admins" style="font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 800; margin-top: 2px;">0</h2>
        </div>
      </div>
      <div class="glass-card stat-card">
        <div class="stat-icon" style="background: rgba(16, 185, 129, 0.15); color: var(--success);">
          <i data-lucide="user-check" style="width: 28px; height: 28px;"></i>
        </div>
        <div>
          <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">Status Sistem</span>
          <h2 style="font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800; margin-top: 2px; color: var(--success);">AKTIF & AMAN</h2>
        </div>
      </div>
    </div>

    <!-- Admin List Section -->
    <div class="glass-card">
      <h3 style="font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 700; margin-bottom: 20px;">Daftar Akun Administrator</h3>
      <div class="admin-table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Username</th>
              <th>Role</th>
              <th>Tanggal Dibuat</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="admins-list-body">
            <!-- Dynamic data injected here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Create Admin Modal -->
  <div class="admin-modal" id="modal-create-admin">
    <div class="glass-card modal-content">
      <button class="close-modal" onclick="closeModal('create')">&times;</button>
      <h3 style="font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 20px;">Tambah Admin Baru</h3>
      
      <form id="form-create-admin">
        <div class="form-group">
          <label class="form-label" for="create-username">Username</label>
          <input type="text" class="form-control" id="create-username" placeholder="Masukkan username baru" required style="width: 100%;">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="create-password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" class="form-control" id="create-password" placeholder="Minimal 6 karakter" required style="width: 100%; padding-right: 46px;">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('create-password', this)">
              <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 12px;">
          Simpan Admin
        </button>
      </form>
    </div>
  </div>

  <!-- Edit Admin Modal -->
  <div class="admin-modal" id="modal-edit-admin">
    <div class="glass-card modal-content">
      <button class="close-modal" onclick="closeModal('edit')">&times;</button>
      <h3 style="font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 20px;">Edit Administrator</h3>
      
      <form id="form-edit-admin">
        <input type="hidden" id="edit-admin-id">
        <div class="form-group">
          <label class="form-label" for="edit-username">Username</label>
          <input type="text" class="form-control" id="edit-username" required style="width: 100%;">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="edit-password">Password Baru (Opsional)</label>
          <div class="password-input-wrapper">
            <input type="password" class="form-control" id="edit-password" placeholder="Kosongkan jika tidak ingin mengubah" style="width: 100%; padding-right: 46px;">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('edit-password', this)">
              <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 12px;">
          Simpan Perubahan
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <script>
    // Elements
    const adminsListBody = document.getElementById('admins-list-body');
    const statTotalAdmins = document.getElementById('stat-total-admins');
    
    const modalCreate = document.getElementById('modal-create-admin');
    const modalEdit = document.getElementById('modal-edit-admin');
    
    const formCreate = document.getElementById('form-create-admin');
    const formEdit = document.getElementById('form-edit-admin');
    
    // Toasts helper
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.style.display = 'flex';
      toast.style.alignItems = 'center';
      toast.style.gap = '8px';
      
      const icon = type === 'success' ? 'check-circle' : 'alert-circle';
      toast.innerHTML = `
        <i data-lucide="${icon}" style="width: 18px; height: 18px; flex-shrink:0;"></i>
        <span>${message}</span>
      `;
      
      container.appendChild(toast);
      if (window.lucide) window.lucide.createIcons();
      
      setTimeout(() => {
        toast.style.animation = 'toastLeave var(--motion-toast) forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Toggle Password Visibility helper
    function togglePasswordVisibility(inputId, btnEl) {
      const input = document.getElementById(inputId);
      const icon = btnEl.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      if (window.lucide) window.lucide.createIcons();
    }

    // Fetch and render admins
    async function loadAdmins() {
      try {
        const res = await fetch('/api/superadmin/admins');
        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.error || 'Gagal memuat admin');
        }

        const admins = data.admins || [];
        statTotalAdmins.innerText = admins.length;
        
        if (admins.length === 0) {
          adminsListBody.innerHTML = `
            <tr>
              <td colspan="6" style="text-align: center; color: var(--text-secondary); padding: 40px;">
                Belum ada administrator yang terdaftar.
              </td>
            </tr>
          `;
          return;
        }

        adminsListBody.innerHTML = admins.map(admin => `
          <tr>
            <td style="font-weight: 700;">#${admin.id}</td>
            <td style="font-weight: 600;">${admin.username}</td>
            <td>
              <span class="action-badge badge-active" style="background: rgba(59, 130, 246, 0.15); color: var(--primary);">
                ${admin.role}
              </span>
            </td>
            <td>${new Date(admin.createdAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}</td>
            <td>
              <span class="action-badge badge-active">
                ${admin.status}
              </span>
            </td>
            <td>
              <div class="table-actions">
                <button class="btn-action" title="Edit Admin" onclick="openEditModal(${admin.id}, '${admin.username}')">
                  <i data-lucide="edit-3" style="width: 16px; height: 16px;"></i>
                </button>
                <button class="btn-action btn-danger-hover" title="Hapus Admin" onclick="deleteAdmin(${admin.id}, '${admin.username}')">
                  <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i>
                </button>
              </div>
            </td>
          </tr>
        `).join('');

        if (window.lucide) window.lucide.createIcons();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    // Modal Control
    function openModal(type) {
      if (type === 'create') {
        formCreate.reset();
        // Reset password fields to hidden
        document.getElementById('create-password').type = 'password';
        modalCreate.style.display = 'flex';
      }
    }

    function closeModal(type) {
      if (type === 'create') {
        modalCreate.style.display = 'none';
      } else if (type === 'edit') {
        modalEdit.style.display = 'none';
      }
    }

    function openEditModal(id, username) {
      formEdit.reset();
      document.getElementById('edit-admin-id').value = id;
      document.getElementById('edit-username').value = username;
      document.getElementById('edit-password').type = 'password';
      modalEdit.style.display = 'flex';
    }

    // Delete flow
    async function deleteAdmin(id, username) {
      if (!confirm(`Apakah Anda yakin ingin menghapus admin "${username}"?`)) return;

      try {
        const res = await fetch(`/api/superadmin/admins/${id}`, {
          method: 'DELETE'
        });
        const data = await res.json();

        if (res.ok) {
          showToast(`Admin ${username} berhasil dihapus.`);
          loadAdmins();
        } else {
          showToast(data.error || 'Gagal menghapus admin', 'danger');
        }
      } catch (err) {
        showToast('Koneksi terputus.', 'danger');
      }
    }

    // Handlers
    formCreate.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('create-username').value;
      const password = document.getElementById('create-password').value;

      try {
        const res = await fetch('/api/superadmin/admins', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          showToast(`Admin ${username} berhasil ditambahkan.`);
          closeModal('create');
          loadAdmins();
        } else {
          showToast(data.error || 'Gagal menyimpan admin', 'danger');
        }
      } catch (err) {
        showToast('Koneksi terputus.', 'danger');
      }
    });

    formEdit.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('edit-admin-id').value;
      const username = document.getElementById('edit-username').value;
      const password = document.getElementById('edit-password').value;

      const payload = { username };
      if (password) payload.password = password;

      try {
        const res = await fetch(`/api/superadmin/admins/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok) {
          showToast(`Admin ${username} berhasil diperbarui.`);
          closeModal('edit');
          loadAdmins();
        } else {
          showToast(data.error || 'Gagal memperbarui admin', 'danger');
        }
      } catch (err) {
        showToast('Koneksi terputus.', 'danger');
      }
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/auth/logout', { method: 'POST' });
        if (res.ok) {
          window.location.href = '/login';
        } else {
          showToast('Gagal logout', 'danger');
        }
      } catch (err) {
        window.location.href = '/login';
      }
    });

    document.getElementById('btn-tambah-admin').addEventListener('click', () => openModal('create'));

    // Boot
    document.addEventListener('DOMContentLoaded', () => {
      loadAdmins();
      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
