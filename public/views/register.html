<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EYECO — Daftar Akun Masyarakat</title>
  <meta name="description" content="Daftarkan akun masyarakat Anda untuk mengakses sistem EYECO.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page" style="padding-top:40px;padding-bottom:40px;">

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="glass-card auth-card" style="max-width:500px;">
    <div class="brand">
      <img src="/uploads/logo-eyeco.png" alt="EYECO" class="auth-logo-img">
      <h1 style="font-family:'Outfit',sans-serif;font-weight:800;font-size:1.6rem;color:#1e3a8a;margin:0 0 4px;">EYECO</h1>
      <p>Daftar Akun Masyarakat</p>
    </div>

    <div id="error-box"   class="error-msg"></div>
    <div id="success-box" class="success-msg"></div>

    <form id="register-form" novalidate>
      <input type="hidden" id="workspaceId">

      <div class="form-row">
        <div class="form-group">
          <label for="name">Nama Lengkap</label>
          <div class="input-wrapper">
            <i data-lucide="user"></i>
            <input type="text" id="name" class="input-control" placeholder="Nama lengkap Anda" autocomplete="name" required>
          </div>
        </div>
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <i data-lucide="at-sign"></i>
            <input type="text" id="username" class="input-control" placeholder="Username unik" autocomplete="username" required>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <i data-lucide="mail"></i>
            <input type="email" id="email" class="input-control" placeholder="Email aktif" autocomplete="email" required>
          </div>
        </div>
        <div class="form-group">
          <label for="phone">Nomor Telepon</label>
          <div class="input-wrapper">
            <i data-lucide="phone"></i>
            <input type="tel" id="phone" class="input-control" placeholder="08xxxxxxxxxx" autocomplete="tel" required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i data-lucide="lock"></i>
          <input type="password" id="password" class="input-control" placeholder="Minimal 6 karakter" autocomplete="new-password" required minlength="6">
        </div>
        <div class="strength-meter"><div id="strength-bar"></div></div>
        <div class="strength-text" id="strength-text"></div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Konfirmasi Password</label>
        <div class="input-wrapper">
          <i data-lucide="check-circle"></i>
          <input type="password" id="confirmPassword" class="input-control" placeholder="Ulangi password" autocomplete="new-password" required minlength="6">
          <div class="validation-icon" id="match-icon"></div>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="btn-submit" disabled>
        <i data-lucide="user-plus" style="width:18px;height:18px;"></i> Daftar Sekarang
      </button>
    </form>

    <div class="links">
      Sudah punya akun? <a href="/login">Masuk di sini</a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    /* ── Pre-fill workspace from query param ── */
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('join')) {
      document.getElementById('workspaceId').value = urlParams.get('join');
    }

    const pwd         = document.getElementById('password');
    const cpwd        = document.getElementById('confirmPassword');
    const strengthBar = document.getElementById('strength-bar');
    const strengthTxt = document.getElementById('strength-text');
    const matchIcon   = document.getElementById('match-icon');
    const submitBtn   = document.getElementById('btn-submit');

    function checkPasswordStrength(val) {
      if (!val) { strengthBar.className = ''; strengthTxt.textContent = ''; return 0; }
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 8 && /[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
      if (val.length >= 10 && /[^A-Za-z0-9]/.test(val)) score++;

      const labels = ['', 'Lemah', 'Sedang', 'Kuat'];
      const classes = ['', 'weak', 'medium', 'strong'];
      const colors  = ['', '#ef4444', '#eab308', '#22c55e'];
      strengthBar.className      = classes[score] || '';
      strengthTxt.textContent    = labels[score]  || '';
      strengthTxt.style.color    = colors[score]  || '';
      return score;
    }

    function checkMatch() {
      const p1 = pwd.value;
      const p2 = cpwd.value;
      if (!p2) { matchIcon.innerHTML = ''; submitBtn.disabled = true; return; }
      if (p1 === p2 && p1.length >= 6) {
        matchIcon.innerHTML = '<i data-lucide="check" style="color:#22c55e;width:18px;height:18px;"></i>';
        submitBtn.disabled = false;
      } else {
        matchIcon.innerHTML = '<i data-lucide="x" style="color:#ef4444;width:18px;height:18px;"></i>';
        submitBtn.disabled = true;
      }
      lucide.createIcons();
    }

    pwd.addEventListener('input',  e => { checkPasswordStrength(e.target.value); checkMatch(); });
    cpwd.addEventListener('input', checkMatch);

    /* ── Form submit ── */
    document.getElementById('register-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn        = document.getElementById('btn-submit');
      const errorBox   = document.getElementById('error-box');
      const successBox = document.getElementById('success-box');

      errorBox.style.display = 'none';

      btn.innerHTML = '<span class="spin"><i data-lucide="loader" style="width:18px;height:18px;"></i></span> Memproses...';
      btn.disabled  = true;
      lucide.createIcons();

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name:        document.getElementById('name').value.trim(),
            username:    document.getElementById('username').value.trim(),
            email:       document.getElementById('email').value.trim(),
            phone:       document.getElementById('phone').value.trim(),
            password:    pwd.value,
            confirmPassword: cpwd.value,
            workspaceId: document.getElementById('workspaceId').value || undefined
          })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          successBox.textContent   = 'Pendaftaran berhasil! Mengarahkan ke halaman login...';
          successBox.style.display = 'block';
          setTimeout(() => { window.location.href = '/login'; }, 2000);
        } else {
          errorBox.textContent   = data.error || data.message || 'Gagal mendaftar';
          errorBox.style.display = 'block';
          resetBtn();
        }
      } catch (err) {
        errorBox.textContent   = 'Terjadi kesalahan jaringan';
        errorBox.style.display = 'block';
        resetBtn();
      }
    });

    function resetBtn() {
      const btn = document.getElementById('btn-submit');
      btn.innerHTML = '<i data-lucide="user-plus" style="width:18px;height:18px;"></i> Daftar Sekarang';
      btn.disabled  = false;
      lucide.createIcons();
    }
  </script>
</body>
</html>
