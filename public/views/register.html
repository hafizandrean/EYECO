<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi - EYECO</title>
  <meta name="description" content="Daftar akun baru di EYECO untuk melaporkan aktivitas mencurigakan di aliran sungai.">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.12) 0%, rgba(9, 13, 22, 0) 65%), var(--bg-gradient);
    }

    .register-card {
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      animation: pageFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon-wrapper {
      background: linear-gradient(135deg, var(--success) 0%, #10b981 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      color: white;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
      transition: transform var(--motion-hover);
    }

    .brand-icon-wrapper:hover {
      transform: scale(1.05) rotate(-5deg);
    }

    .password-wrapper {
      position: relative;
    }

    .password-toggle-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 4px;
      transition: color var(--motion-hover);
    }

    .password-toggle-btn:hover {
      color: var(--text-primary);
    }

    .form-control {
      transition: border-color var(--motion-hover), box-shadow var(--motion-hover);
    }

    .form-control:focus {
      border-color: var(--success);
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
    }
  </style>
</head>
<body>

  <main class="glass-card register-card">

    <div class="brand-header">
      <div class="brand-icon-wrapper">
        <i data-lucide="user-plus" style="width: 28px; height: 28px;"></i>
      </div>
      <h2 style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.8rem; letter-spacing: -0.5px;">Registrasi Akun</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 6px;">Daftar sebagai pelapor aktivitas aliran sungai</p>
    </div>

    <!-- Error message alert -->
    <div id="error-alert" style="display: none; background: var(--danger-bg); border: 1px solid rgba(239, 68, 68, 0.25); color: var(--danger); padding: 12px 16px; border-radius: var(--radius-input); font-size: 0.85rem; font-weight: 600; margin-bottom: 20px; align-items: center; gap: 10px; animation: pageFadeIn 0.2s ease;">
      <i data-lucide="alert-circle" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
      <span id="error-text">Terjadi kesalahan saat pendaftaran</span>
    </div>

    <!-- Success message alert -->
    <div id="success-alert" style="display: none; background: var(--success-bg); border: 1px solid rgba(16, 185, 129, 0.25); color: var(--success); padding: 12px 16px; border-radius: var(--radius-input); font-size: 0.85rem; font-weight: 600; margin-bottom: 20px; align-items: center; gap: 10px; animation: pageFadeIn 0.2s ease;">
      <i data-lucide="check-circle" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
      <span>Registrasi berhasil! Mengalihkan ke login...</span>
    </div>

    <form id="register-form">
      <!-- Nama Lengkap -->
      <div class="form-group" style="margin-bottom: 18px;">
        <label class="form-label" for="reg-name" style="font-weight: 600; font-size: 0.85rem;">Nama Lengkap</label>
        <div style="position: relative;">
          <input type="text" class="form-control" id="reg-name" placeholder="Masukkan nama lengkap" required style="width: 100%; padding-left: 42px; height: 46px; border-radius: var(--radius-input);">
          <i data-lucide="user" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted);"></i>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group" style="margin-bottom: 18px;">
        <label class="form-label" for="reg-email" style="font-weight: 600; font-size: 0.85rem;">Email</label>
        <div style="position: relative;">
          <input type="email" class="form-control" id="reg-email" placeholder="nama@email.com" required style="width: 100%; padding-left: 42px; height: 46px; border-radius: var(--radius-input);">
          <i data-lucide="mail" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted);"></i>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group" style="margin-bottom: 18px;">
        <label class="form-label" for="reg-password" style="font-weight: 600; font-size: 0.85rem;">Password</label>
        <div class="password-wrapper">
          <input type="password" class="form-control" id="reg-password" placeholder="Password minimal 6 karakter" required style="width: 100%; padding-left: 42px; padding-right: 46px; height: 46px; border-radius: var(--radius-input);" minlength="6">
          <i data-lucide="key" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted);"></i>
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('reg-password', this)">
            <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="reg-confirm-password" style="font-weight: 600; font-size: 0.85rem;">Konfirmasi Password</label>
        <div class="password-wrapper">
          <input type="password" class="form-control" id="reg-confirm-password" placeholder="Ulangi password" required style="width: 100%; padding-left: 42px; padding-right: 46px; height: 46px; border-radius: var(--radius-input);">
          <i data-lucide="key" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted);"></i>
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('reg-confirm-password', this)">
            <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-register-submit" class="btn btn-primary" style="width: 100%; padding: 12px; height: 46px; border-radius: var(--radius-input); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 0.95rem; background-color: var(--success); border-color: var(--success); box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);">
        Daftar Akun <i data-lucide="user-check" style="width: 18px; height: 18px;"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 18px;">
      <p style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 550;">
        Sudah punya akun? <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 700; transition: color var(--motion-hover);">Masuk di sini</a>
      </p>
    </div>

  </main>

  <script>
    const form = document.getElementById('register-form');
    const errorAlert = document.getElementById('error-alert');
    const successAlert = document.getElementById('success-alert');
    const errorText = document.getElementById('error-text');
    const submitBtn = document.getElementById('btn-register-submit');

    function togglePasswordVisibility(inputId, btnEl) {
      const input = document.getElementById(inputId);
      const icon = btnEl.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      if (window.lucide) window.lucide.createIcons();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      successAlert.style.display = 'none';

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      if (!name) {
        errorText.innerText = 'Nama lengkap wajib diisi.';
        errorAlert.style.display = 'flex';
        return;
      }

      if (!email) {
        errorText.innerText = 'Email wajib diisi.';
        errorAlert.style.display = 'flex';
        return;
      }

      if (password !== confirmPassword) {
        errorText.innerText = 'Konfirmasi password tidak cocok.';
        errorAlert.style.display = 'flex';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i data-lucide="loader" style="width: 18px; height: 18px; animation: spin 1s linear infinite;"></i> Mendaftarkan...';
      if (window.lucide) window.lucide.createIcons();

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, confirmPassword })
        });

        const data = await res.json();

        if (res.ok) {
          successAlert.style.display = 'flex';
          form.reset();
          setTimeout(() => {
            window.location.href = '/login';
          }, 1500);
        } else {
          errorText.innerText = data.error || 'Gagal mendaftarkan akun.';
          errorAlert.style.display = 'flex';
        }
      } catch (err) {
        console.error('Error registering:', err);
        errorText.innerText = 'Koneksi ke server gagal.';
        errorAlert.style.display = 'flex';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Daftar Akun <i data-lucide="user-check" style="width: 18px; height: 18px;"></i>';
        if (window.lucide) window.lucide.createIcons();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) window.lucide.createIcons();
    });

    // Also init on load
    if (window.lucide) window.lucide.createIcons();
  </script>
</body>
</html>
