<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi 2FA - EYECO</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0a1628 0%, #0f172a 45%, #1e3a5f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #f1f5f9;
      overflow: hidden;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
    }

    .bg-glow-1 {
      top: -15%;
      left: -10%;
      width: 420px;
      height: 420px;
      background: #1d4ed8;
    }

    .bg-glow-2 {
      bottom: -15%;
      right: -10%;
      width: 420px;
      height: 420px;
      background: #2563eb;
    }

    .glass-card-2fa {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
      animation: fadeInUp 0.6s ease-out;
      z-index: 10;
      position: relative;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-badge {
      background: rgba(37, 99, 235, 0.25);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      color: #93c5fd;
      margin-bottom: 16px;
      border: 1px solid rgba(147, 197, 253, 0.25);
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.25);
    }

    .title-2fa {
      font-weight: 800;
      font-size: 1.75rem;
      letter-spacing: -0.5px;
      color: #f8fafc;
      margin-bottom: 8px;
    }

    .subtitle-2fa {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 28px;
      line-height: 1.55;
      font-weight: 500;
    }

    .otp-input {
      width: 100%;
      padding: 16px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 10px;
      text-align: center;
      color: #ffffff;
      transition: all 0.25s ease;
    }

    .otp-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      background: rgba(15, 23, 42, 0.75);
    }

    .error-message {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
      text-align: left;
    }

    .back-link {
      display: inline-block;
      margin-top: 22px;
      font-size: 0.85rem;
      color: #94a3b8;
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:hover {
      color: #93c5fd;
    }
  </style>
</head>
<body class="dark-mode">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <main class="glass-card-2fa">
    <div class="logo-badge">
      <i data-feather="shield" style="width: 28px; height: 28px;"></i>
    </div>

    <h1 class="title-2fa">Verifikasi Keamanan</h1>
    <p class="subtitle-2fa">
      Masukkan 6 digit kode OTP dari aplikasi authenticator Anda untuk menyelesaikan proses masuk admin.
    </p>

    <div id="error-box" class="error-message">
      <i data-feather="alert-circle" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
      <span id="error-text"></span>
    </div>

    <form id="otp-form">
      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="code">Kode OTP 6 Digit</label>
        <input
          type="text"
          id="code"
          class="otp-input"
          maxlength="6"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="000000"
          autocomplete="one-time-code"
          required
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">
        Verifikasi <i data-feather="check-circle" style="width: 16px; height: 16px; margin-left: 4px;"></i>
      </button>
    </form>

    <a href="/login" class="back-link">← Kembali ke halaman login</a>
  </main>

  <script>
    const form = document.getElementById('otp-form');
    const codeInput = document.getElementById('code');
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text');

    const urlParams = new URLSearchParams(window.location.search);
    const tempToken = urlParams.get('tempToken');

    function showError(message) {
      errorText.textContent = message;
      errorBox.style.display = 'flex';
    }

    if (!tempToken) {
      showError('Token verifikasi tidak valid. Silakan login kembali.');
      setTimeout(() => { window.location.href = '/login'; }, 3000);
    }

    codeInput.addEventListener('input', () => {
      codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const code = codeInput.value.trim();
      if (code.length !== 6) {
        showError('Kode OTP harus berupa 6 digit angka.');
        return;
      }

      try {
        const response = await fetch('/api/auth/verify-2fa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tempToken, code })
        });

        const data = await response.json();

        if (response.ok) {
          if (data.role === 'admin' || data.role === 'superadmin') {
            window.location.href = '/dashboard';
          } else {
            window.location.href = '/dashboard/upload';
          }
        } else {
          showError(data.error || 'Verifikasi gagal.');
        }
      } catch (err) {
        showError('Terjadi kesalahan pada server. Silakan coba lagi.');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      feather.replace();
      codeInput.focus();
    });
  </script>
</body>
</html>
