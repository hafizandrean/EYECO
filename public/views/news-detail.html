<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EYECO — Berita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>(function(){var t=localStorage.getItem('eyeco-theme');if(t==='dark'){document.documentElement.classList.add('dark-mode')}})()</script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --primary:#2563EB;--primary-light:#3B82F6;--primary-dark:#1D4ED8;
      --bg:#F0F4FF;--bg-card:rgba(255,255,255,0.75);--text-primary:#0F172A;
      --text-secondary:#475569;--text-muted:#94A3B8;
      --radius-card:16px;--border:1px solid rgba(0,0,0,0.06);
    }
    .dark-mode{
      --primary:#60A5FA;--primary-light:rgba(96,165,250,0.12);--primary-dark:#93BBFC;
      --bg:#0B1120;--bg-card:rgba(30,41,59,0.85);--text-primary:#E2E8F0;
      --text-secondary:#94A3B8;--text-muted:#64748B;
      --border:1px solid rgba(148,163,184,0.08);
    }
    .dark-mode body{background:#0B1120;}
    .dark-mode .blob-1{background:#3B82F6;opacity:0.1;}
    .dark-mode .blob-2{background:#8B5CF6;opacity:0.08;}
    .dark-mode .news-content{background:rgba(30,41,59,0.75);border-color:rgba(148,163,184,0.08);}
    body{
      font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-primary);
      min-height:100vh;line-height:1.7;
    }

    /* Background blobs — match landing page exactly */
    .bg-blobs{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
    .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.18}
    .blob-1{width:560px;height:560px;background:#2563EB;top:-120px;left:-120px}
    .blob-2{width:420px;height:420px;background:#7C3AED;bottom:-80px;right:-80px}

    /* Noise overlay — same as landing page */
    body::after{content:'';position:fixed;inset:0;z-index:-1;opacity:0.018;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none;}

    .container{max-width:720px;margin:0 auto;padding:0 20px;position:relative;z-index:1;}

    /* Header back */
    .news-navbar{
      padding:20px 0;display:flex;align-items:center;justify-content:space-between;
    }
    .news-back{
      display:inline-flex;align-items:center;gap:8px;text-decoration:none;
      color:var(--text-secondary);font-size:0.9rem;font-weight:600;
      transition:color 0.2s;cursor:pointer;background:none;border:none;
    }
    .news-back:hover{color:var(--primary);}
    .news-logo{font-family:'Outfit',sans-serif;font-weight:800;font-size:1.1rem;color:var(--primary);}
    .news-logo span{color:var(--primary-dark);}

    /* Article */
    .news-header{margin:24px 0 16px;}
    .news-header .category{
      display:inline-block;font-size:0.72rem;font-weight:700;text-transform:uppercase;
      letter-spacing:0.5px;color:var(--primary);
      background:rgba(37,99,235,0.08);padding:3px 12px;border-radius:20px;margin-bottom:12px;
    }
    .news-header h1{
      font-family:'Outfit',sans-serif;font-size:1.8rem;font-weight:800;
      line-height:1.25;color:var(--text-primary);margin-bottom:12px;
    }
    .news-header .meta{
      display:flex;gap:16px;font-size:0.82rem;color:var(--text-muted);
      flex-wrap:wrap;
    }
    .news-header .meta span{display:inline-flex;align-items:center;gap:6px;}

    /* Gallery */
    .news-gallery{
      margin:20px 0;border-radius:var(--radius-card);overflow:hidden;
      background:rgba(37,99,235,0.04);
    }
    .news-gallery-main{
      width:100%;max-height:420px;overflow:hidden;position:relative;
      background:#0F172A;
    }
    .news-gallery-main img{
      width:100%;height:420px;object-fit:contain;display:block;
      transition:opacity 0.3s;
    }
    .news-gallery-thumbs{
      display:flex;gap:8px;padding:12px 16px;overflow-x:auto;
      scrollbar-width:none;-ms-overflow-style:none;
    }
    .news-gallery-thumbs::-webkit-scrollbar{display:none;}
    .news-gallery-thumbs .thumb{
      flex:0 0 64px;height:48px;border-radius:6px;overflow:hidden;
      cursor:pointer;border:2px solid transparent;transition:border 0.2s,opacity 0.2s;
      opacity:0.5;
    }
    .news-gallery-thumbs .thumb.active{border-color:var(--primary);opacity:1;}
    .news-gallery-thumbs .thumb img{width:100%;height:100%;object-fit:cover;display:block;}

    .news-content{
      background:var(--bg-card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border-radius:var(--radius-card);padding:32px;
      border:var(--border);margin-bottom:40px;
    }
    .news-content p{
      margin-bottom:1.5em;font-size:0.95rem;color:var(--text-secondary);
      line-height:1.8;text-align:justify;
    }
    .news-content p:last-child{margin-bottom:0;}
    .news-content img{max-width:100%;border-radius:10px;margin:16px 0;}

    .news-loading{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:80px 20px;text-align:center;
    }
    .news-loading .spinner{width:32px;height:32px;border:3px solid rgba(37,99,235,0.12);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px;}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:640px){
      .news-header h1{font-size:1.35rem;}
      .news-content{padding:20px;border-radius:12px;}
      .container{padding:0 16px;}
      .news-gallery-main img{height:260px;}
    }
  </style>
</head>
<body>
  <!-- Background blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>
  <div class="container">
    <nav class="news-navbar">
      <button class="news-back" onclick="history.back()">
        <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Kembali
      </button>
      <div class="news-logo">EYECO<span>.</span></div>
    </nav>

    <div id="news-loading" class="news-loading">
      <div class="spinner"></div>
      <p style="color:var(--text-muted);font-size:0.9rem;">Memuat berita...</p>
    </div>

    <article id="news-article" style="display:none;">
      <div class="news-header">
        <span class="category" id="news-category"></span>
        <h1 id="news-title"></h1>
        <div class="meta">
          <span><i data-lucide="user" style="width:14px;height:14px;"></i> <span id="news-author"></span></span>
          <span><i data-lucide="calendar" style="width:14px;height:14px;"></i> <span id="news-date"></span></span>
        </div>
      </div>

      <!-- Gallery: thumbnail + extra images -->
      <div class="news-gallery" id="news-gallery" style="display:none;">
        <div class="news-gallery-main">
          <img id="news-gallery-img" src="" alt="">
        </div>
        <div class="news-gallery-thumbs" id="news-gallery-thumbs"></div>
      </div>

      <div class="news-content" id="news-body"></div>
    </article>

    <div id="news-error" style="display:none;padding:60px 20px;text-align:center;">
      <i data-lucide="alert-circle" style="width:40px;height:40px;color:var(--error,#EF4444);margin-bottom:12px;"></i>
      <p style="color:var(--text-secondary);">Berita tidak ditemukan.</p>
      <a href="/" style="display:inline-block;margin-top:16px;color:var(--primary);font-weight:600;">Kembali ke Beranda</a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    (async () => {
      const slug = window.location.pathname.split('/').pop();
      const loadingEl = document.getElementById('news-loading');
      const articleEl = document.getElementById('news-article');
      const errorEl = document.getElementById('news-error');

      try {
        const res = await fetch('/api/news/public/item/' + slug);
        const data = await res.json();
        if (!data.success || !data.news) throw new Error('not found');

        const item = data.news;
        document.title = item.title + ' — EYECO';
        document.getElementById('news-title').textContent = item.title;
        document.getElementById('news-category').textContent = item.category || 'Informasi';
        document.getElementById('news-author').textContent = item.author;
        document.getElementById('news-date').textContent = new Date(item.createdAt || item.publishedAt).toLocaleDateString('id-ID', {
          year: 'numeric', month: 'long', day: 'numeric'
        });

        // Gallery — kumpulin semua gambar (thumbnail + images[] )
        const allImages = [];
        if (item.thumbnail) allImages.push(item.thumbnail);
        if (Array.isArray(item.images)) {
          item.images.forEach(url => {
            if (!allImages.includes(url)) allImages.push(url);
          });
        }

        if (allImages.length > 0) {
          const gallery = document.getElementById('news-gallery');
          const mainImg = document.getElementById('news-gallery-img');
          const thumbsContainer = document.getElementById('news-gallery-thumbs');
          gallery.style.display = 'block';

          let activeIdx = 0;

          function showImage(idx) {
            activeIdx = idx;
            mainImg.src = allImages[idx];
            mainImg.style.opacity = '0';
            setTimeout(() => { mainImg.style.opacity = '1'; }, 50);
            thumbsContainer.querySelectorAll('.thumb').forEach((el, i) => {
              el.classList.toggle('active', i === idx);
            });
          }

          // Thumbnails
          thumbsContainer.innerHTML = allImages.map((url, i) => `
            <div class="thumb ${i === 0 ? 'active' : ''}">
              <img src="${url}" alt="" loading="lazy" data-idx="${i}">
            </div>
          `).join('');

          thumbsContainer.addEventListener('click', (e) => {
            const thumb = e.target.closest('.thumb');
            if (thumb) {
              const idx = parseInt(thumb.querySelector('img').dataset.idx);
              showImage(idx);
            }
          });

          showImage(0);
        }

        // Content
        const paragraphs = item.content
          .split(/\n\s*\n/)
          .map(p => p.replace(/\n/g, ' ').trim())
          .filter(p => p.length > 0);
        document.getElementById('news-body').innerHTML = paragraphs.map(p => `<p>${p}</p>`).join('');

        loadingEl.style.display = 'none';
        articleEl.style.display = 'block';
        lucide.createIcons();
      } catch (_) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
