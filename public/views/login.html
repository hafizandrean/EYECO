<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Eyeco</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px;">
  
  <main class="glass-card" style="width: 100%; max-width: 420px; padding: 35px 30px;">
    
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="background: var(--primary); display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 50%; color: white; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);">
        <i data-feather="lock" style="width: 28px; height: 28px;"></i>
      </div>
      <h2 style="font-weight: 800; font-size: 1.8rem; letter-spacing: -0.5px;">Eyeco Login</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px; font-weight: 550;">Masuk untuk mengakses monitoring sungai</p>
    </div>

    <!-- Error message alert -->
    <div id="error-alert" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--danger); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; margin-bottom: 16px; align-items: center; gap: 8px;">
      <i data-feather="alert-circle" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
      <span id="error-text">Kredensial salah</span>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-username">Username</label>
        <div style="position: relative;">
          <input type="text" class="form-control" id="login-username" placeholder="Masukkan username" required style="width: 100%;">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div style="position: relative;">
          <input type="password" class="form-control" id="login-password" placeholder="Masukkan password" required style="width: 100%; padding-right: 40px;">
          <span id="toggle-login-password" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); display: flex; align-items: center;">
            <i data-feather="eye" style="width: 18px; height: 18px;"></i>
          </span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">
        Masuk
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 15px;">
      <p style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 550;">
        Belum punya akun? <a href="/register" style="color: var(--primary); text-decoration: none; font-weight: 700;">Daftar Sekarang</a>
      </p>
    </div>

  </main>

  <script>
    const form = document.getElementById('login-form');
    const errorAlert = document.getElementById('error-alert');
    const errorText = document.getElementById('error-text');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';

      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      if (!username || !password) {
        errorText.innerText = 'Semua kolom harus diisi.';
        errorAlert.style.display = 'flex';
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          // Redirect based on role and username
          if (data.username === 'admin') {
            window.location.href = '/admin-register';
          } else if (data.role === 'admin') {
            window.location.href = '/dashboard';
          } else {
            window.location.href = '/dashboard/upload';
          }
        } else {
          errorText.innerText = data.error || 'Username atau password salah.';
          errorAlert.style.display = 'flex';
        }
      } catch (err) {
        console.error('Error logging in:', err);
        errorText.innerText = 'Koneksi ke server gagal.';
        errorAlert.style.display = 'flex';
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      feather.replace();
      
      const togglePassword = document.getElementById('toggle-login-password');
      if (togglePassword) {
        togglePassword.addEventListener('click', function () {
          const passwordInput = document.getElementById('login-password');
          if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            this.innerHTML = '<i data-feather="eye-off" style="width: 18px; height: 18px;"></i>';
          } else {
            passwordInput.type = 'password';
            this.innerHTML = '<i data-feather="eye" style="width: 18px; height: 18px;"></i>';
          }
          feather.replace();
        });
      }
    });
  </script>
</body>
</html>
