<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EYECO — Login</title>
  <meta name="description" content="Masuk ke sistem EYECO Incident Command Center.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="glass-card auth-card">
    <div class="brand">
      <h1><i data-lucide="waves"></i> EYECO</h1>
      <p>Incident Command Center</p>
    </div>

    <div id="error-box"   class="error-msg"></div>
    <div id="success-box" class="success-msg"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="username">Email atau Username</label>
        <div class="input-wrapper">
          <i data-lucide="user"></i>
          <input
            type="text"
            id="username"
            class="input-control"
            placeholder="Masukkan email atau username"
            autocomplete="username"
            required
          >
        </div>
      </div>

      <div class="form-group" style="margin-bottom:12px;">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i data-lucide="lock"></i>
          <input
            type="password"
            id="password"
            class="input-control"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          >
          <div class="toggle-password" id="toggle-password" role="button" tabindex="0" aria-label="Tampilkan password">
            <i data-lucide="eye" style="width:18px;height:18px;"></i>
          </div>
        </div>
      </div>

      <div class="options-row">
        <label for="remember-me">
          <input type="checkbox" id="remember-me"> Ingat saya
        </label>
        <a href="#" onclick="alert('Silakan hubungi administrator untuk mereset password Anda.'); return false;">
          Lupa Password?
        </a>
      </div>

      <button type="submit" class="btn-primary" id="btn-submit">
        <i data-lucide="log-in" style="width:18px;height:18px;"></i>
        Masuk ke Sistem
      </button>
    </form>

    <div class="links">
      <div>Belum punya akun masyarakat? <a href="/register">Daftar di sini</a></div>
      <div class="divider"></div>
      <div>Organisasi baru? <a href="/register-superadmin">Daftarkan Organisasi</a></div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    /* ── Toggle password visibility ── */
    const togglePwd   = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');

    function togglePasswordVisibility() {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      togglePwd.innerHTML = isHidden
        ? '<i data-lucide="eye-off" style="width:18px;height:18px;"></i>'
        : '<i data-lucide="eye"     style="width:18px;height:18px;"></i>';
      lucide.createIcons();
    }

    togglePwd.addEventListener('click', togglePasswordVisibility);
    togglePwd.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePasswordVisibility(); }
    });

    /* ── Login form submit ── */
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();

      const btn        = document.getElementById('btn-submit');
      const errorBox   = document.getElementById('error-box');
      const successBox = document.getElementById('success-box');

      errorBox.style.display   = 'none';
      successBox.style.display = 'none';

      btn.innerHTML = '<span class="spin"><i data-lucide="loader" style="width:18px;height:18px;"></i></span> Memproses...';
      btn.disabled  = true;
      lucide.createIcons();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: passwordInput.value
          })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          successBox.textContent    = 'Login berhasil! Mengarahkan...';
          successBox.style.display  = 'block';

          setTimeout(() => {
            if (data.role === 'superadmin') window.location.href = '/superadmin';
            else if (data.role === 'admin') window.location.href = '/dashboard';
            else window.location.href = '/select-workspace';
          }, 900);
        } else {
          errorBox.textContent   = data.error || data.message || 'Login gagal';
          errorBox.style.display = 'block';
          resetBtn();
        }
      } catch (err) {
        errorBox.textContent   = 'Terjadi kesalahan jaringan. Periksa koneksi Anda.';
        errorBox.style.display = 'block';
        resetBtn();
      }
    });

    function resetBtn() {
      const btn = document.getElementById('btn-submit');
      btn.innerHTML = '<i data-lucide="log-in" style="width:18px;height:18px;"></i> Masuk ke Sistem';
      btn.disabled  = false;
      lucide.createIcons();
    }
  </script>
</body>
</html>
