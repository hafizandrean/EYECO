<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>EYECO - Pusat Komando Insiden CCTV AI</title>
  <link rel="stylesheet" href="/css/style.css?v=2.0.0">
  <!-- Load Lucide Icons CDN (Fork of Feather Icons) -->
  <script src="https://unpkg.com/lucide@latest"></script>
<!-- HLS.js for live stream playback (Tuya HLS / m3u8 streams) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
</head>
<body>
  <!-- Background decorative blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>
  
  <div class="layout-container" id="app-shell">
    
    <!-- Floating Header Section (Shared across all pages) -->
    <header class="glass-card header-floating" id="app-header">
      <!-- Left side: Brand Logo & Search Box -->
      <div class="header-left-group">
        <a href="/dashboard" class="brand-logo" id="btn-brand-logo">
          <img src="/uploads/logo-eyeco.png" alt="EYECO" class="brand-logo-img">
          <span>EYECO</span>
        </a>

      </div>

      <!-- Center: Navigation Capsule OR Search (Settings) -->
      <nav class="nav-tabs-capsule" id="nav-capsule">
        <div class="nav-tabs" id="nav-tabs">
          <div class="nav-indicator" id="nav-indicator"></div>
          <a href="/dashboard/beranda" class="nav-tab nav-tab-home" data-tab="beranda" style="display:none;">
            <span class="nav-text">Beranda</span>
          </a>
          <a href="/dashboard" class="nav-tab active" data-tab="dashboard">
            <span class="nav-text">Dasbor</span>
          </a>
          <a href="/dashboard/laporan" class="nav-tab" data-tab="laporan">
            <span class="nav-text">Daftar Laporan</span>
          </a>
          <a href="/dashboard/upload" class="nav-tab" data-tab="upload">
            <span class="nav-text">Unggah Bukti</span>
          </a>
          <a href="/dashboard/cctv-monitoring" class="nav-tab" data-tab="cctv-monitoring" style="display:none;" id="nav-tab-cctv">
            <span class="nav-text">CCTV</span>
          </a>
          <a href="/dashboard/berita" class="nav-tab" data-tab="berita" style="display:none;" id="nav-tab-berita">
            <span class="nav-text">Berita</span>
          </a>
        </div>
        <!-- Search bar (shown on settings page) -->
        <div class="nav-search" id="nav-search" style="display:none;">
          <div class="settings-search">
            <i data-lucide="search" style="width:18px;height:18px;"></i>
            <input type="text" id="settings-search-input" placeholder="Cari pengaturan..." autocomplete="off">
          </div>
        </div>
      </nav>

      <!-- Right side: Actions Group (Export, Notifications, Darkmode, Profile) -->
      <div class="header-right-group">
        <!-- Conditional Export Button (Icon only) -->
        <button class="btn-icon-toggle header-export-btn" id="btn-header-export" title="Export CSV">
          <i data-lucide="download"></i>
        </button>

        <!-- Notification Bell Dropdown -->
        <div class="notification-bell-wrapper">
          <button class="btn-icon-toggle btn-bell" id="btn-bell" title="Pusat Peringatan AI">
            <i data-lucide="bell"></i>
            <span class="bell-badge-count" id="bell-badge">0</span>
          </button>
          <div class="notification-dropdown glass-card" id="notification-dropdown">
            <div class="notification-dropdown-header">
              <span>Pusat Notifikasi</span>
              <span class="caption-label">10 Peringatan Terakhir</span>
            </div>
            <div class="notification-list-container" id="notification-list">
              <!-- Render notifications list dynamically -->
            </div>
          </div>
        </div>

        <!-- User Profile Dropdown -->
        <div class="profile-dropdown-wrapper">
          <button class="profile-trigger-btn" id="profile-trigger">
            <div class="profile-avatar" id="profile-avatar-display">AD</div>
            <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: var(--text-secondary);"></i>
          </button>
          <div class="profile-dropdown-menu glass-card" id="profile-dropdown">
            <div class="dropdown-user-info">
              <div class="user-info-name" id="dropdown-username">Admin</div>
              <div class="user-info-role" id="dropdown-role">ADMIN</div>
            </div>
            <div class="divider-line"></div>
            <a href="/dashboard/settings" class="dropdown-item-btn" id="btn-dropdown-profile">
              <i data-lucide="settings"></i> Pengaturan
            </a>
            <div class="divider-line"></div>
            <button class="dropdown-item-btn text-danger" id="btn-dropdown-logout">
              <i data-lucide="log-out"></i> Keluar Sesi
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Viewport (Dynamic pages are injected here) -->
    <main class="viewport-viewport" id="app-viewport">
      <!-- Loader or skeleton on start -->
      <div style="display:flex; flex-direction:column; gap: 24px; width:100%; max-width:1400px; margin: 0 auto;">
        <div class="glass-card skeleton-cctv" style="height: 100px; width:100%;">
          <div class="skeleton skeleton-title" style="width: 25%;"></div>
          <div class="skeleton skeleton-line-short" style="width: 50%; margin-top: 12px;"></div>
        </div>
      </div>
    </main>

  </div>

  <!-- Toast Notification Container (Toasts appended dynamically) -->
  <div class="toast-container" id="toast-container"></div>

  <!-- App bootstrapper -->
  <script type="module" src="/js/core/app.js?v=28.0.0"></script>

</body>
</html>
