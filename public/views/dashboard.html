<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EYECO - AI CCTV Incident Command Center</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Load Lucide Icons CDN (Fork of Feather Icons) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Load Hls.js CDN to support HLS video streaming in Chrome/Firefox/Edge -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
  
  <div class="layout-container">
    
    <!-- Floating Header Section (Shared across all pages) -->
    <header class="glass-card header-floating" id="app-header">
      <!-- Left side: Brand Logo & Search Box -->
      <div class="header-left-group">
        <a href="/dashboard" class="brand-logo" id="btn-brand-logo" style="font-family: 'Outfit', sans-serif; font-weight: 800; letter-spacing: 2px; text-decoration: none; color: var(--primary); font-size: 1.2rem; display: flex; align-items: center; gap: 0;">
          <span>EYECO</span>
        </a>
        <div class="global-search-wrapper">
          <input type="text" id="header-global-search" class="header-search-control" placeholder="Cari lokasi, ID... (Ctrl + K)" style="padding-left: 16px;">
        </div>
      </div>

      <!-- Center: Navigation Capsule (Sliding Bubble Tab Bar) -->
      <nav class="nav-tabs-capsule">
        <div class="nav-tabs">
          <div class="nav-indicator"></div>
          <a href="/dashboard" class="nav-tab active" data-tab="dashboard">
            Dashboard
          </a>
          <a href="/dashboard/laporan" class="nav-tab" data-tab="laporan">
            Daftar Laporan
          </a>
          <a href="/dashboard/upload" class="nav-tab" data-tab="upload">
            Upload Bukti
          </a>
        </div>
      </nav>

      <!-- Right side: Actions Group (Export, Notifications, Darkmode, Profile) -->
      <div class="header-right-group">
        <!-- Conditional Export Button -->
        <button class="btn btn-glass btn-rounded header-export-btn" id="btn-header-export" style="font-size: 0.75rem; font-weight: 700; padding: 10px 14px;">
          Export CSV
        </button>

        <!-- Theme Toggle Button -->
        <button class="btn btn-glass btn-rounded" id="btn-theme" title="Ubah Tema" style="font-size: 0.75rem; font-weight: 700; padding: 10px 14px; min-width: 65px; text-align: center; text-transform: uppercase;">
          DARK
        </button>

        <!-- Notification Bell Dropdown -->
        <div class="notification-bell-wrapper">
          <button class="btn btn-glass btn-rounded btn-bell" id="btn-bell" title="Pusat Peringatan AI" style="font-size: 0.75rem; font-weight: 700; padding: 10px 14px; position: relative;">
            ALERTS <span class="bell-badge-count" id="bell-badge">0</span>
          </button>
          <div class="notification-dropdown glass-card" id="notification-dropdown">
            <div class="notification-dropdown-header">
              <span>Pusat Notifikasi</span>
              <span class="caption-label">10 Alert Terakhir</span>
            </div>
            <div class="notification-list-container" id="notification-list">
              <!-- Render notifications list dynamically -->
            </div>
          </div>
        </div>

        <!-- User Profile Dropdown -->
        <div class="profile-dropdown-wrapper">
          <button class="profile-trigger-btn" id="profile-trigger">
            <div class="profile-avatar" id="profile-avatar-display">AD</div>
            <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: var(--text-secondary);"></i>
          </button>
          <div class="profile-dropdown-menu glass-card" id="profile-dropdown">
            <div class="dropdown-user-info">
              <div class="user-info-name" id="dropdown-username">Admin</div>
              <div class="user-info-role" id="dropdown-role">ADMIN</div>
            </div>
            <div class="divider-line"></div>
            <a href="/profile" class="dropdown-item-btn" id="btn-dropdown-profile" style="text-decoration: none; color: var(--text-primary); display: flex; align-items: center; gap: 8px;">
              👤 Profil Saya
            </a>
            <div class="divider-line"></div>
            <button class="dropdown-item-btn text-danger" id="btn-dropdown-logout" style="display: flex; align-items: center; gap: 8px;">
              🚪 Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Viewport (Dynamic pages are injected here) -->
    <main class="viewport-viewport" id="app-viewport">
      <!-- Loader or skeleton on start -->
      <div style="display:flex; flex-direction:column; gap: 24px; width:100%;">
        <div class="glass-card skeleton-cctv" style="height: 100px; width:100%;">
          <div class="skeleton skeleton-title" style="width: 25%;"></div>
          <div class="skeleton skeleton-line-short" style="width: 50%; margin-top: 12px;"></div>
        </div>
      </div>
    </main>

  </div>

  <!-- Global Command Palette Modal Dialog -->
  <div class="modal command-palette-modal" id="command-palette-modal">
    <div class="cmd-palette-container glass-card">
      <div class="cmd-search-bar">
        <i data-lucide="search" class="cmd-search-icon"></i>
        <input type="text" class="cmd-input" placeholder="Ketik perintah pencarian..." autofocus>
      </div>
      <div class="cmd-list" id="command-palette-list">
        <!-- Dyn list -->
      </div>
      <div class="cmd-footer">
        <span>Gunakan <kbd>↑</kbd> <kbd>↓</kbd> untuk navigasi, <kbd>Enter</kbd> untuk memilih, <kbd>Esc</kbd> untuk menutup</span>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container (Toasts appended dynamically) -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Shared Bootstrapper script module -->
  <script type="module" src="/js/core/app.js"></script>
</body>
</html>
