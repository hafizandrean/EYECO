<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EYECO — Environmental AI Platform untuk Kabupaten Bandung. Computer vision + partisipasi warga = lingkungan lebih bersih.">
  <title>EYECO — Pantau Lingkungan Real-time</title>
  <link rel="stylesheet" href="/css/style.css?v=2.0.0">
  <!-- Load Lucide Icons CDN (Fork of Feather Icons) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { Home } from '/js/pages/home.js?v=1.2.0';
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('app-viewport');
      if (container) Home.render(container);
    });
  </script>
</head>
<body>
  <header class="glass-card header-floating landing-public-nav" id="landing-nav">
    <div class="header-left-group">
      <a href="/" class="brand-logo" id="landing-brand">
        <img src="/uploads/logo-eyeco.png" alt="EYECO" class="brand-logo-img">
        <span>EYECO</span>
      </a>
    </div>
    <div class="landing-nav-actions">
      <a href="/register" class="btn btn-outline btn-sm btn-rounded" id="landing-btn-register">Daftar</a>
      <a href="/login" class="btn btn-primary btn-sm btn-rounded" id="landing-btn-login">Masuk</a>
    </div>
  </header>
  <main class="viewport-viewport" id="app-viewport" style="max-width: none; padding: 0; margin: 0;">
    <!-- Landing page will be rendered here by HomePage -->
  </main>
</body>
</html>
