<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Bukti Baru - EYECO</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>
  <div class="container">
    
    <!-- Header Section -->
    <header class="glass-card header-card" style="padding: 18px 24px;">
      <div class="header-left">
        <h2 style="font-size: 1.5rem; font-weight: 800;">Upload Bukti Baru</h2>
        <p style="font-size: 0.85rem; color: var(--text-secondary);">Tambahkan rekaman/gambar pemantauan sungai untuk dianalisis oleh AI</p>
        <div style="margin-top: 8px; font-size: 0.85rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 6px;">
          <i data-feather="user" style="width: 14px; height: 14px;"></i> Logged in as: <span id="current-user-display">Loading...</span>
        </div>
      </div>
      <div style="display: flex; gap: 12px;">
        <a href="/dashboard" class="btn btn-glass" id="btn-back-dashboard" style="display: none;">
          <i data-feather="arrow-left"></i> Kembali ke Dashboard
        </a>
        <button class="btn btn-glass" id="btn-logout" style="color: var(--danger); border-color: rgba(239, 68, 68, 0.3);">
          <i data-feather="log-out"></i> Logout
        </button>
      </div>
    </header>

    <!-- Upload Form Card -->
    <main class="glass-card" style="max-width: 800px; margin: 0 auto; width: 100%;">
      <form id="upload-form" enctype="multipart/form-data">
        
        <div class="form-group">
          <label class="form-label" for="input-location">Lokasi Pemantauan <span>*</span></label>
          <input type="text" class="form-control" id="input-location" placeholder="Contoh: Sungai Ciliwung Jembatan Merah" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="input-identity">Identitas / Ciri (Opsional)</label>
          <input type="text" class="form-control" id="input-identity" placeholder="Dapat dikosongkan jika anonim">
        </div>

        <div class="form-group">
          <label class="form-label" for="input-time">Waktu Rekaman <span>*</span></label>
          <div style="display: flex; gap: 10px;">
            <input type="datetime-local" class="form-control" id="input-time" style="flex: 1;" required>
            <button type="button" class="btn btn-glass" id="btn-current-time">Waktu Saat Ini</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="input-source-type">Jenis Sumber <span>*</span></label>
          <select class="form-control" id="input-source-type" required>
            <option value="Video">Video (Rekomendasi untuk Analisis Durasi AI)</option>
            <option value="Gambar">Gambar (Foto Tunggal CCTV)</option>
            <option value="Live Stream">Rekaman Potongan Live Stream</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">File Media (MP4/JPG/PNG) <span>*</span></label>
          <div class="file-input-wrapper">
            <label class="btn btn-glass btn-file">
              <i data-feather="upload-cloud"></i> Pilih File
              <input type="file" id="input-file" accept="image/*,video/*" required>
            </label>
            <span id="file-name" style="font-size: 0.9rem; color: var(--text-muted); font-weight: 550;">Belum ada file dipilih</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="input-notes">Keterangan Tambahan (Opsional)</label>
          <textarea class="form-control" id="input-notes" placeholder="Tambahkan deskripsi atau catatan khusus untuk arsip..."></textarea>
        </div>

        <div style="margin-top: 24px;">
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px 20px;">
            <i data-feather="cpu"></i> Mulai Analisis AI & Simpan
          </button>
        </div>

      </form>
    </main>

    <!-- History Card for Normal User -->
    <section class="glass-card" id="user-history-card" style="max-width: 800px; margin: 24px auto 0 auto; width: 100%; display: none;">
      <div class="card-title" style="margin-bottom: 16px;">
        <i data-feather="clock"></i> Laporan Saya
      </div>
      <div class="table-container">
        <table class="custom-table">
          <thead>
            <tr>
              <th>Bukti</th>
              <th>Lokasi & Waktu</th>
              <th>Hasil AI</th>
              <th>Status Admin</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <tr>
              <td colspan="4" style="text-align: center; padding: 20px; color: var(--text-muted);">
                Belum ada laporan yang diunggah
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Simulated AI Loading Overlay -->
    <div class="loading-overlay" id="loading-screen">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-title">Menghubungkan ke server...</div>
      <div class="loading-subtext" id="loading-subtitle">Menyiapkan media upload</div>
    </div>

  </div>

  <script>
    const fileInput = document.getElementById('input-file');
    const fileNameSpan = document.getElementById('file-name');
    const btnCurrentTime = document.getElementById('btn-current-time');
    const inputTime = document.getElementById('input-time');
    
    const uploadForm = document.getElementById('upload-form');
    const loadingScreen = document.getElementById('loading-screen');
    const loadingTitle = document.getElementById('loading-title');
    const loadingSubtitle = document.getElementById('loading-subtitle');

    // Display selected file name
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileNameSpan.innerText = file.name;
        fileNameSpan.style.color = 'var(--text-primary)';
      } else {
        fileNameSpan.innerText = 'Belum ada file dipilih';
        fileNameSpan.style.color = 'var(--text-muted)';
      }
    });

    // Populate current date and time
    btnCurrentTime.addEventListener('click', () => {
      const now = new Date();
      // Format to YYYY-MM-DDThh:mm
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      
      inputTime.value = `${year}-${month}-${day}T${hours}:${minutes}`;
    });

    // Handle form submit with simulated AI pipeline
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const location = document.getElementById('input-location').value;
      const identity = document.getElementById('input-identity').value;
      const time = document.getElementById('input-time').value;
      const sourceType = document.getElementById('input-source-type').value;
      const notes = document.getElementById('input-notes').value;
      const file = fileInput.files[0];

      if (!location || !time || !file) {
        alert('Mohon lengkapi semua field bertanda bintang (*).');
        return;
      }

      // Show overlay
      loadingScreen.style.display = 'flex';

      const pipelineSteps = [
        { title: 'Mengunggah Media...', subtitle: 'Mengirim file bukti ke server EYECO' },
        { title: 'Inisialisasi Model AI...', subtitle: 'Memuat bobot YOLOv8 Nano & segmentasi sungai' },
        { title: 'Menjalankan Deteksi Objek...', subtitle: 'Menganalisis frame media untuk mendeteksi manusia, kendaraan, dan sampah' },
        { title: 'Mengevaluasi Tingkat Ancaman...', subtitle: 'Menghitung skor keyakinan anomali sungai' },
        { title: 'Menyimpan Hasil...', subtitle: 'Mendaftarkan deteksi ke database log pantauan' }
      ];

      // Run visual progression for 4 seconds
      for (let i = 0; i < pipelineSteps.length; i++) {
        loadingTitle.innerText = pipelineSteps[i].title;
        loadingSubtitle.innerText = pipelineSteps[i].subtitle;
        await new Promise(resolve => setTimeout(resolve, 800));
      }

      // Prepare actual request body
      // We will upload it as multipart form data
      const formData = new FormData();
      formData.append('location', location);
      formData.append('identity', identity);
      formData.append('timestamp', new Date(time).toISOString());
      formData.append('sourceType', sourceType);
      formData.append('additionalNotes', notes);
      formData.append('file', file);

      try {
        const res = await fetch('/api/detections', {
          method: 'POST',
          body: formData
        });

        if (res.ok) {
          loadingTitle.innerText = 'Selesai!';
          loadingSubtitle.innerText = 'Laporan berhasil disimpan. Mengalihkan...';
          await new Promise(resolve => setTimeout(resolve, 500));
          
          if (currentUser && currentUser.role === 'admin') {
            window.location.href = '/dashboard';
          } else {
            // normal user stays here but page reloads to show their new report in "Laporan Saya"
            window.location.reload();
          }
        } else {
          throw new Error('Server returned failure');
        }
      } catch (err) {
        console.error('Error uploading file:', err);
        loadingScreen.style.display = 'none';
        alert('Gagal mengupload dan menganalisis bukti ke server.');
      }
    });

    let currentUser = null;

    // Session validation
    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) {
          window.location.href = '/login';
          return;
        }
        currentUser = await res.json();
        document.getElementById('current-user-display').innerText = `${currentUser.username} (${currentUser.role.toUpperCase()})`;
        
        if (currentUser.role === 'admin') {
          document.getElementById('btn-back-dashboard').style.display = 'inline-flex';
        } else {
          document.getElementById('user-history-card').style.display = 'block';
          loadUserHistory();
        }
      } catch (err) {
        console.error('Auth check failed:', err);
        window.location.href = '/login';
      }
    }

    // Helper to format date
    function formatDate(isoString) {
      const date = new Date(isoString);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const day = date.getDate();
      const month = months[date.getMonth()];
      const year = date.getFullYear();
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${day} ${month} ${year}, ${hours}:${minutes} WIB`;
    }

    // Load User Report History
    async function loadUserHistory() {
      const userTableBody = document.getElementById('user-table-body');
      userTableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px;">Memuat riwayat...</td></tr>';
      
      try {
        const res = await fetch('/api/detections?limit=50'); // Fetch up to 50 logs for history
        if (!res.ok) throw new Error('Failed to load logs');
        const data = await res.json();
        
        userTableBody.innerHTML = '';
        if (data.reports.length === 0) {
          userTableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: var(--text-muted);">Belum ada laporan yang Anda unggah</td></tr>';
          return;
        }

        data.reports.forEach(report => {
          let aiBadgeClass = 'badge-none';
          if (report.aiStatus === 'TINGGI') aiBadgeClass = 'badge-high';
          else if (report.aiStatus === 'SEDANG') aiBadgeClass = 'badge-medium';
          else if (report.aiStatus === 'RENDAH') aiBadgeClass = 'badge-low';

          let adminBadgeClass = 'status-pending';
          if (report.adminStatus === 'VALID') adminBadgeClass = 'status-valid';
          else if (report.adminStatus === 'DIABAIKAN') adminBadgeClass = 'status-ignored';

          let boxesHtml = '';
          if (report.boundingBoxes && report.boundingBoxes.length > 0) {
            report.boundingBoxes.forEach(box => {
              boxesHtml += `<div class="yolo-preview-box" style="top:${box.y}%; left:${box.x}%; width:${box.w}%; height:${box.h}%; border-width: 1px;"></div>`;
            });
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>
              <div class="thumbnail-cell">
                <img src="${report.image}" alt="Bukti">
                ${boxesHtml}
              </div>
            </td>
            <td>
              <div class="location-cell">
                <div class="location-name"><i data-feather="map-pin" style="width:14px; height:14px; color:var(--primary);"></i> ${report.location}</div>
                <div class="location-time">${formatDate(report.timestamp)}</div>
              </div>
            </td>
            <td>
              <span class="badge ${aiBadgeClass}">${report.aiStatus}</span>
            </td>
            <td>
              <span class="status-badge ${adminBadgeClass}">${report.adminStatus}</span>
            </td>
          `;
          userTableBody.appendChild(tr);
        });

        feather.replace();
      } catch (err) {
        console.error('Error loading history:', err);
        userTableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: var(--danger);">Gagal memuat riwayat.</td></tr>';
      }
    }

    // Logout handler
    document.getElementById('btn-logout').addEventListener('click', async () => {
      if (!confirm('Apakah Anda yakin ingin keluar?')) return;
      try {
        const res = await fetch('/api/auth/logout', { method: 'POST' });
        if (res.ok) {
          window.location.href = '/login';
        }
      } catch (err) {
        console.error('Logout failed:', err);
      }
    });

    // Initialize Page
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      feather.replace();
      
      // Auto fill time field by default
      btnCurrentTime.click();
    });
  </script>
</body>
</html>
