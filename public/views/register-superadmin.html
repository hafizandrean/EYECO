<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EYECO — Daftarkan Organisasi</title>
  <meta name="description" content="Daftarkan organisasi Anda dan buat akun SuperAdmin EYECO.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page" style="padding-top:40px;padding-bottom:40px;">

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="glass-card auth-card" style="max-width:600px;">
    <div class="brand">
      <img src="/uploads/logo-eyeco.png" alt="EYECO" class="auth-logo-img">
      <h1 style="font-family:'Outfit',sans-serif;font-weight:800;font-size:1.6rem;color:#1e3a8a;margin:0 0 4px;">EYECO</h1>
      <p>Daftar Superadmin &amp; Organisasi</p>
    </div>

    <div id="error-box"   class="error-msg"></div>
    <div id="success-box" class="success-msg"></div>

    <form id="registerForm" novalidate>

      <div class="form-row">
        <div class="form-group">
          <label for="orgName">Nama Organisasi <span style="color:var(--error)">*</span></label>
          <div class="input-wrapper">
            <i data-lucide="building"></i>
            <input type="text" name="orgName" id="orgName" class="input-control" required placeholder="PT Contoh">
          </div>
        </div>
        <div class="form-group">
          <label for="workspaceName">Nama Workspace Utama <span style="color:var(--error)">*</span></label>
          <div class="input-wrapper">
            <i data-lucide="layout"></i>
            <input type="text" name="workspaceName" id="workspaceName" class="input-control" required placeholder="Pusat">
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="picName">Nama Penanggung Jawab (PIC) <span style="color:var(--error)">*</span></label>
          <div class="input-wrapper">
            <i data-lucide="user"></i>
            <input type="text" name="picName" id="picName" class="input-control" required placeholder="Nama Lengkap">
          </div>
        </div>
        <div class="form-group">
          <label for="email">Email PIC <span style="color:var(--error)">*</span></label>
          <div class="input-wrapper">
            <i data-lucide="mail"></i>
            <input type="email" name="email" id="email" class="input-control" required placeholder="email@contoh.com" autocomplete="email">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="username">Username Superadmin <span style="color:var(--error)">*</span></label>
        <div class="input-wrapper">
          <i data-lucide="at-sign"></i>
          <input type="text" name="username" id="username" class="input-control" required placeholder="superadmin1" autocomplete="username">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password <span style="color:var(--error)">*</span></label>
          <div class="input-wrapper">
            <i data-lucide="lock"></i>
            <input type="password" name="password" id="password" class="input-control" required placeholder="Minimal 8 karakter" minlength="8" autocomplete="new-password">
          </div>
          <div class="strength-meter"><div id="strength-bar"></div><div id="strength-bar2"></div><div id="strength-bar3"></div><div id="strength-bar4"></div><div id="strength-bar5"></div></div>
          <div class="strength-text" id="strength-text"></div>
          <small style="color:#94A3B8;font-size:0.68rem;">Minimal 8 karakter: huruf besar, huruf kecil, angka, simbol (!@#$%^&*)</small>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Konfirmasi Password <span style="color:var(--error)">*</span></label>
          <div class="input-wrapper">
            <i data-lucide="check-circle"></i>
            <input type="password" name="confirmPassword" id="confirmPassword" class="input-control" required placeholder="Ulangi password" minlength="8" autocomplete="new-password">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="address">Alamat Organisasi <span style="color:var(--error)">*</span></label>
        <div class="input-wrapper">
          <i data-lucide="map-pin"></i>
          <input type="text" name="address" id="address" class="input-control" required placeholder="Alamat lengkap organisasi">
        </div>
      </div>

      <div class="form-group">
        <label for="description">Deskripsi Singkat</label>
        <textarea name="description" id="description" class="input-control" rows="3" placeholder="Bergerak di bidang..."></textarea>
      </div>

      <button type="submit" class="btn-primary" id="btn-submit" style="margin-top:8px;">
        <i data-lucide="building" style="width:18px;height:18px;"></i> Buat Organisasi
      </button>
    </form>

    <div class="links">
      Sudah punya organisasi? <a href="/login">Masuk di sini</a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const pwd         = document.getElementById('password');
    const cpwd        = document.getElementById('confirmPassword');
    const strengthBar = document.getElementById('strength-bar');
    const strengthBar2 = document.getElementById('strength-bar2');
    const strengthBar3 = document.getElementById('strength-bar3');
    const strengthBar4 = document.getElementById('strength-bar4');
    const strengthBar5 = document.getElementById('strength-bar5');
    const strengthTxt = document.getElementById('strength-text');

    function checkPasswordStrength(val) {
      if (!val) { 
        strengthBar.className = ''; 
        if (strengthBar2) strengthBar2.className = '';
        if (strengthBar3) strengthBar3.className = '';
        if (strengthBar4) strengthBar4.className = '';
        if (strengthBar5) strengthBar5.className = '';
        strengthTxt.textContent = ''; 
        return 0; 
      }
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const labels = ['', 'Sangat Lemah', 'Lemah', 'Sedang', 'Kuat', 'Sangat Kuat'];
      const colors  = ['', '#ef4444', '#ef4444', '#eab308', '#22c55e', '#16a34a'];
      const bars = [strengthBar, strengthBar2, strengthBar3, strengthBar4, strengthBar5];
      bars.forEach((bar, i) => {
        if (bar) bar.style.background = i < score ? colors[score] : 'rgba(0,0,0,0.1)';
      });
      strengthTxt.textContent    = labels[score]  || '';
      strengthTxt.style.color    = colors[score]  || '';
      return score;
    }

    pwd.addEventListener('input',  e => { checkPasswordStrength(e.target.value); });

    document.getElementById('registerForm').addEventListener('submit', async e => {
      e.preventDefault();

      const btn        = document.getElementById('btn-submit');
      const errorBox   = document.getElementById('error-box');
      const successBox = document.getElementById('success-box');

      errorBox.style.display   = 'none';
      successBox.style.display = 'none';

      const formData = new FormData(e.target);
      const data     = Object.fromEntries(formData);

      if (data.password !== data.confirmPassword) {
        errorBox.textContent   = 'Password tidak cocok. Periksa kembali konfirmasi password.';
        errorBox.style.display = 'block';
        return;
      }
      if (data.password.length < 8) {
        errorBox.textContent   = 'Password minimal 8 karakter.';
        errorBox.style.display = 'block';
        return;
      }
      if (!/[A-Z]/.test(data.password) || !/[a-z]/.test(data.password) || !/[0-9]/.test(data.password) || !/[^A-Za-z0-9]/.test(data.password)) {
        errorBox.textContent   = 'Password harus mengandung huruf besar, huruf kecil, angka, dan simbol.';
        errorBox.style.display = 'block';
        return;
      }

      btn.innerHTML = '<span class="spin"><i data-lucide="loader" style="width:18px;height:18px;"></i></span> Memproses...';
      btn.disabled  = true;
      lucide.createIcons();

      try {
        const response = await fetch('/api/auth/register-superadmin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const resData = await response.json().catch(() => ({}));

        if (response.ok) {
          successBox.textContent   = 'Registrasi berhasil! Mengarahkan ke dashboard...';
          successBox.style.display = 'block';
          setTimeout(() => {
            window.location.href = resData.redirect || '/superadmin';
          }, 1500);
        } else {
          errorBox.textContent   = resData.error || resData.message || 'Gagal mendaftar';
          errorBox.style.display = 'block';
          resetBtn();
        }
      } catch (err) {
        errorBox.textContent   = 'Terjadi kesalahan jaringan';
        errorBox.style.display = 'block';
        resetBtn();
      }
    });

    function resetBtn() {
      const btn = document.getElementById('btn-submit');
      btn.innerHTML = '<i data-lucide="building" style="width:18px;height:18px;"></i> Buat Organisasi';
      btn.disabled  = false;
      lucide.createIcons();
    }
  </script>
  <script>(function(){const t=localStorage.getItem('eyeco-theme');if(t==='dark')document.body.classList.add('dark-mode')})();</script>
</body>
</html>
